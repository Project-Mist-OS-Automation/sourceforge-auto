name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile URL"
        required: true
        type: string

      device:
        description: "Device name"
        required: true
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

      GOFILE_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare environment
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            file \
            sshpass \
            openssh-client \
            ca-certificates \
            python3 \
            python3-requests

          mkdir -p "$RUNNER_TEMP/mistos/download"
          mkdir -p "$RUNNER_TEMP/mistos/logs"

      # ==========================================================
      # VALIDATE INPUT
      # ==========================================================

      - name: Validate input
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device is empty."
            exit 1
          fi

          if [[ "$DEVICE" == *"/"* ||
                "$DEVICE" == *"\\"* ||
                "$DEVICE" == "." ||
                "$DEVICE" == ".." ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          echo "Gofile : $GOFILE_URL"
          echo "Device : $DEVICE"

      # ==========================================================
      # EXTRACT GOFILE ID
      # ==========================================================

      - name: Extract Gofile ID
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          set -Eeuo pipefail

          URL="${GOFILE_URL%%\?*}"
          URL="${URL%/}"

          if [[ "$URL" =~ /d/([^/]+)$ ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Gofile ID."
            echo "Expected: https://gofile.io/d/XXXXXXXX"
            exit 1
          fi

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

          echo
          echo "Gofile ID: $GOFILE_ID"

      # ==========================================================
      # GET GOFILE WEBSITE TOKEN SECRET
      # ==========================================================

      - name: Get current Gofile WT secret
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              GET GOFILE WEBSITE TOKEN"
          echo "============================================================"

          WT_JS="$RUNNER_TEMP/mistos/gofile_wt.js"

          mkdir -p "$RUNNER_TEMP/mistos"

          URLS=(
            "https://gofile.io/js/wt.obf.js"
            "https://gofile.io/dist/js/wt.obf.js"
          )

          FOUND=0

          for URL in "${URLS[@]}"; do

            echo
            echo "Trying:"
            echo "$URL"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 30 \
                --max-time 60 \
                --output "$WT_JS" \
                --write-out "%{http_code}" \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: */*" \
                -H "Referer: https://gofile.io/" \
                "$URL" \
                || true
            )"

            echo "HTTP: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]] &&
               [[ -s "$WT_JS" ]]; then

              if ! head -c 100 "$WT_JS" |
                grep -qiE '<html|<!doctype'; then

                echo "WT script downloaded."

                FOUND=1
                break
              fi
            fi

          done

          if [[ "$FOUND" -ne 1 ]]; then
            echo
            echo "::error::Unable to download current Gofile WT script."
            exit 1
          fi

          echo
          echo "WT script size:"
          wc -c "$WT_JS"

          echo
          echo "Searching script for token salt..."

          python3 <<'PY'
          import os
          import re
          import sys

          path = os.environ["RUNNER_TEMP"] + "/mistos/gofile_wt.js"

          data = open(
              path,
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          # Gofile's token secret has historically appeared
          # as a string literal near the WT generator.
          #
          # Look for likely 10-40 character literals containing
          # letters/numbers and surrounding token-generation code.

          candidates = []

          patterns = [
              r'["\']([A-Za-z0-9]{10,40})["\']',
              r'["\']([A-Za-z0-9_-]{10,40})["\']',
          ]

          for pattern in patterns:
              for match in re.finditer(pattern, data):
                  value = match.group(1)

                  # Ignore common JS values.
                  if value.lower() in {
                      "undefined",
                      "javascript",
                      "application",
                      "textjavascript",
                      "gofile",
                      "website",
                      "window",
                      "function",
                      "undefined",
                      "localstorage",
                      "authorization",
                      "content",
                      "contents",
                      "api",
                  }:
                      continue

                  pos = match.start()

                  surrounding = data[
                      max(0, pos - 800):
                      min(len(data), pos + 800)
                  ].lower()

                  score = 0

                  for keyword in [
                      "generatewt",
                      "websitetoken",
                      "website-token",
                      "sha256",
                      "accounttoken",
                      "token",
                      "14400",
                      "four",
                      "3600",
                  ]:
                      if keyword in surrounding:
                          score += 1

                  candidates.append(
                      (score, value)
                  )

          candidates.sort(
              key=lambda x: (-x[0], len(x[1]))
          )

          if not candidates:
              print(
                  "::error::No possible WT secret found."
              )
              sys.exit(1)

          # Remove duplicates while keeping score.
          seen = set()

          unique = []

          for score, value in candidates:
              if value in seen:
                  continue

              seen.add(value)
              unique.append((score, value))

          print(
              f"Found {len(unique)} candidate strings."
          )

          # We cannot safely assume the first arbitrary string is
          # the secret. Print candidate scores only, not values.
          for score, value in unique[:20]:
              print(
                  f"Candidate score={score}, length={len(value)}"
              )

          # Save candidates for the next step.
          output = os.environ["RUNNER_TEMP"] + \
                   "/mistos/wt_candidates.txt"

          with open(output, "w") as f:
              for score, value in unique:
                  f.write(
                      f"{score}\t{value}\n"
                  )

          print(
              f"Candidates saved to {output}"
          )
          PY

      # ==========================================================
      # CREATE GOFILE ACCOUNT
      # ==========================================================

      - name: Create Gofile account
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "               CREATE GOFILE ACCOUNT"
          echo "============================================================"

          RESPONSE="$RUNNER_TEMP/mistos/logs/account.json"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 60 \
              --output "$RESPONSE" \
              --write-out "%{http_code}" \
              -X POST \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              -H "X-BL: $GOFILE_LANGUAGE" \
              "https://api.gofile.io/accounts"
          )"

          echo "HTTP: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo
            cat "$RESPONSE"
            exit 1
          fi

          STATUS="$(
            jq -r '.status // empty' "$RESPONSE"
          )"

          if [[ "$STATUS" != "ok" ]]; then
            jq . "$RESPONSE"
            exit 1
          fi

          TOKEN="$(
            jq -r '.data.token // empty' "$RESPONSE"
          )"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::No account token returned."
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "GOFILE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          echo "Gofile account created."

      # ==========================================================
      # GENERATE WEBSITE TOKEN
      # ==========================================================

      - name: Generate Gofile website token
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              GENERATE GOFILE WEBSITE TOKEN"
          echo "============================================================"

          python3 <<'PY'
          import hashlib
          import os
          import time

          ua = os.environ["GOFILE_USER_AGENT"]
          lang = os.environ["GOFILE_LANGUAGE"]
          account = os.environ["GOFILE_TOKEN"]

          candidates_file = (
              os.environ["RUNNER_TEMP"] +
              "/mistos/wt_candidates.txt"
          )

          with open(candidates_file) as f:
              candidates = [
                  line.rstrip("\n").split("\t", 1)
                  for line in f
              ]

          current_window = int(time.time()) // 14400

          # We test candidate secrets against Gofile.
          #
          # The actual validation happens in the next step.

          output = (
              os.environ["RUNNER_TEMP"] +
              "/mistos/wt_tokens.txt"
          )

          with open(output, "w") as f:

              for score, secret in candidates:

                  for window in [
                      current_window,
                      current_window - 1
                  ]:

                      raw = (
                          f"{ua}::"
                          f"{lang}::"
                          f"{account}::"
                          f"{window}::"
                          f"{secret}"
                      )

                      token = hashlib.sha256(
                          raw.encode()
                      ).hexdigest()

                      f.write(
                          f"{score}\t"
                          f"{window}\t"
                          f"{secret}\t"
                          f"{token}\n"
                      )

          print(
              f"Generated {len(candidates) * 2} "
              "candidate website tokens."
          )
          PY

      # ==========================================================
      # TEST WEBSITE TOKENS
      # ==========================================================

      - name: Resolve Gofile content
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                 RESOLVE GOFILE CONTENT"
          echo "============================================================"

          RESPONSE="$RUNNER_TEMP/mistos/logs/content.json"
          TOKENS="$RUNNER_TEMP/mistos/wt_tokens.txt"

          FOUND=0

          COUNT=0

          while IFS=$'\t' read -r SCORE WINDOW SECRET TOKEN; do

            COUNT=$((COUNT + 1))

            # Don't print secret/token.
            echo
            echo "Testing candidate $COUNT..."

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE" \
                --write-out "%{http_code}" \
                --connect-timeout 15 \
                --max-time 30 \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                -H "X-Website-Token: ${TOKEN}" \
                -H "X-BL: ${GOFILE_LANGUAGE}" \
                -H "Origin: https://gofile.io" \
                -H "Referer: https://gofile.io/" \
                -G \
                --data-urlencode "contentFilter=" \
                --data-urlencode "page=1" \
                --data-urlencode "pageSize=1000" \
                --data-urlencode "sortField=name" \
                --data-urlencode "sortDirection=1" \
                "https://api.gofile.io/contents/${GOFILE_ID}" \
                || true
            )"

            echo "HTTP: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]]; then

              STATUS="$(
                jq -r '.status // empty' "$RESPONSE" 2>/dev/null || true
              )"

              if [[ "$STATUS" == "ok" ]]; then

                echo
                echo "============================================================"
                echo "             GOFILE TOKEN SUCCESSFULLY FOUND"
                echo "============================================================"

                echo "GOFILE_WEBSITE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                echo "GOFILE_WT_WINDOW=$WINDOW" >> "$GITHUB_ENV"
                echo "GOFILE_WT_SECRET=$SECRET" >> "$GITHUB_ENV"

                FOUND=1
                break
              fi

            elif [[ "$HTTP_CODE" == "429" ]]; then

              echo
              echo "::error::Gofile rate limit reached."
              echo
              echo "The workflow will stop instead of hammering Gofile."
              exit 20

            fi

          done < "$TOKENS"

          if [[ "$FOUND" -ne 1 ]]; then

            echo
            echo "============================================================"
            echo "               NO VALID GOFILE TOKEN"
            echo "============================================================"

            echo
            echo "Gofile response:"
            jq . "$RESPONSE" 2>/dev/null || true

            echo
            echo "::error::Could not generate a valid Gofile website token."
            exit 1
          fi

          echo
          echo "Gofile content successfully resolved."

          jq . "$RESPONSE"

      # ==========================================================
      # EXTRACT FILE
      # ==========================================================

      - name: Extract file information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "               EXTRACT FILE INFORMATION"
          echo "============================================================"

          JSON="$RUNNER_TEMP/mistos/logs/content.json"

          python3 <<'PY'
          import json
          import os
          import sys

          path = os.environ["RUNNER_TEMP"] + \
                 "/mistos/logs/content.json"

          with open(path) as f:
              data = json.load(f)

          root = data.get("data", {})

          files = []

          if root.get("type") == "file":
              files.append(root)

          children = root.get("children", {})

          if isinstance(children, dict):
              files.extend(
                  x for x in children.values()
                  if x.get("type") == "file"
              )

          elif isinstance(children, list):
              files.extend(
                  x for x in children
                  if x.get("type") == "file"
              )

          if not files:
              print("ERROR: No files found.")
              sys.exit(1)

          if len(files) != 1:
              print(
                  f"ERROR: Expected one file, found {len(files)}."
              )
              sys.exit(1)

          item = files[0]

          name = item.get("name", "")
          size = item.get("size", 0)
          link = item.get("link", "")

          if not name:
              print("ERROR: Missing filename.")
              sys.exit(1)

          if not link:
              print("ERROR: Missing download link.")
              sys.exit(1)

          print(f"Filename: {name}")
          print(f"Size: {size}")

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as f:

              f.write(
                  f"GOFILE_FILENAME={name}\n"
              )

              f.write(
                  f"GOFILE_EXPECTED_SIZE={size}\n"
              )

              f.write(
                  f"GOFILE_DIRECT_LINK={link}\n"
              )
          PY

      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Download Gofile file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          OUTPUT="$RUNNER_TEMP/mistos/download/$GOFILE_FILENAME"

          curl \
            --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 0 \
            -A "$GOFILE_USER_AGENT" \
            -H "Cookie: accountToken=${GOFILE_TOKEN}" \
            -C - \
            --progress-bar \
            -o "$OUTPUT" \
            "$GOFILE_DIRECT_LINK"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          SIZE="$(stat -c '%s' "$OUTPUT")"

          echo
          echo "Downloaded:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "$SIZE bytes"

          if [[ "$SIZE" -lt 10000 ]]; then
            echo "::error::Downloaded response is suspiciously small."
            head -c 1000 "$OUTPUT" || true
            exit 1
          fi

          TYPE="$(file -b "$OUTPUT")"

          echo
          echo "Type:"
          echo "$TYPE"

          if echo "$TYPE" |
             grep -qiE 'HTML|ASCII text|Unicode text|JSON|XML'; then

            echo "::error::Downloaded response is not a binary file."

            head -c 1000 "$OUTPUT" || true

            exit 1
          fi

          SHA="$(sha256sum "$OUTPUT" | awk '{print $1}')"

          echo
          echo "SHA256:"
          echo "$SHA"

          echo "DOWNLOADED_FILE=$OUTPUT" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SHA256=$SHA" >> "$GITHUB_ENV"

      # ==========================================================
      # SOURCEFORGE CONNECTION
      # ==========================================================

      - name: Test SourceForge connection
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CONNECTION"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_test.txt"

          cat > "$SCRIPT" <<EOF
          pwd
          ls
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge connection successful."

      # ==========================================================
      # DEVICE DIRECTORY
      # ==========================================================

      - name: Check or create device directory
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE DEVICE DIRECTORY"
          echo "============================================================"

          BASE="/home/frs/project-mistos/Android17"

          CHECK="$RUNNER_TEMP/sourceforge_check.txt"

          cat > "$CHECK" <<EOF
          cd ${BASE}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$CHECK" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net" \
            > "$RUNNER_TEMP/mistos/logs/device.log" 2>&1

          STATUS=$?

          set -e

          if [[ "$STATUS" -eq 0 ]]; then

            echo "Device directory exists."

          else

            echo "Creating device directory..."

            CREATE="$RUNNER_TEMP/sourceforge_create.txt"

            cat > "$CREATE" <<EOF
          cd ${BASE}
          mkdir ${DEVICE}
          bye
          EOF

            chmod 600 "$CREATE"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -b "$CREATE" \
              "${SOURCEFORGE_USER}@frs.sourceforge.net"

            echo "Device directory created."
          fi

          echo "SOURCEFORGE_DEVICE_DIR=${BASE}/${DEVICE}" >> "$GITHUB_ENV"

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload to SourceForge
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          echo "File:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "$DOWNLOADED_SHA256"

          SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${GOFILE_FILENAME}"
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Upload completed."

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify SourceForge upload
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_verify.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "============================================================"
          echo "                    UPLOAD VERIFIED"
          echo "============================================================"

          echo
          echo "SourceForge:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/"

      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          rm -rf "$RUNNER_TEMP/mistos"

          rm -f \
            "$RUNNER_TEMP/sourceforge_test.txt" \
            "$RUNNER_TEMP/sourceforge_check.txt" \
            "$RUNNER_TEMP/sourceforge_create.txt" \
            "$RUNNER_TEMP/sourceforge_upload.txt" \
            "$RUNNER_TEMP/sourceforge_verify.txt"

          echo "Local downloaded files removed."
          echo "Cleanup complete."

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device: ${{ inputs.device }}"

          if [[ -n "${GOFILE_FILENAME:-}" ]]; then
            echo "File: $GOFILE_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size: $DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256: $DOWNLOADED_SHA256"
          fi

          echo
          echo "Directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/"

          echo
          echo "============================================================"
