name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (raphael, bluejay, lisa, sweet, etc.)"
        required: true
        type: string

jobs:
  transfer:
    name: Download and Upload
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

    steps:

      # ==========================================================
      # 1. Prepare environment
      # ==========================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              MistOS Gofile → SourceForge"
          echo "============================================================"

          echo "Installing required packages..."

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            jq \
            openssh-client \
            sshpass \
            ca-certificates

          mkdir -p "$RUNNER_TEMP/mistos-transfer/download"

          echo
          echo "Environment ready."

      # ==========================================================
      # 2. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name: $DEVICE"
            echo "Allowed examples:"
            echo "  raphael"
            echo "  bluejay"
            echo "  lisa"
            echo "  sweet"
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"

          echo
          echo "SourceForge destination:"
          echo "Android17/$DEVICE/"

      # ==========================================================
      # 3. Check credentials
      # ==========================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              SOURCEFORGE CREDENTIAL CHECK"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "::error::SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "::error::SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "SourceForge user: $SOURCEFORGE_USER"
          echo "SourceForge password: ********"
          echo
          echo "Credentials found."

      # ==========================================================
      # 4. Download from Gofile
      # ==========================================================

      - name: Download from Gofile
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"

          cd "$DOWNLOAD_DIR"

          echo "Download URL:"
          echo "$GOFILE_URL"

          echo
          echo "Starting download..."
          echo

          wget \
            --content-disposition \
            --trust-server-names \
            --show-progress \
            --progress=dot:giga \
            --timeout=60 \
            --tries=10 \
            --waitretry=10 \
            --retry-connrefused \
            "$GOFILE_URL"

          echo
          echo "Gofile download completed."

      # ==========================================================
      # 5. Validate downloaded file
      # ==========================================================

      - name: Validate downloaded file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  DOWNLOAD VALIDATION"
          echo "============================================================"

          mapfile -t FILES < <(
            find "$DOWNLOAD_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%p\n'
          )

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::No file was downloaded."
            exit 1
          fi

          if [[ "${#FILES[@]}" -gt 1 ]]; then
            echo "::error::More than one file was downloaded."

            printf '%s\n' "${FILES[@]}"

            exit 1
          fi

          FILE="${FILES[0]}"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          FILENAME="$(basename "$FILE")"
          SIZE="$(stat -c '%s' "$FILE")"
          HUMAN_SIZE="$(du -h "$FILE" | cut -f1)"
          SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "Filename : $FILENAME"
          echo "Size     : $SIZE bytes"
          echo "Size     : $HUMAN_SIZE"
          echo "SHA256   : $SHA256"

          echo
          echo "Downloaded file is valid."

          {
            echo "DOWNLOADED_FILE=$FILE"
            echo "DOWNLOADED_FILENAME=$FILENAME"
            echo "DOWNLOADED_SIZE=$SIZE"
            echo "DOWNLOADED_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # 6. Upload to SourceForge
      # ==========================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          SOURCEFORGE_HOST="frs.sourceforge.net"

          REMOTE_DIR="/home/frs/project-mistos/Android17/${DEVICE}"

          echo "Host      : $SOURCEFORGE_HOST"
          echo "User      : $SOURCEFORGE_USER"
          echo "Project   : $SOURCEFORGE_PROJECT"
          echo "Directory : $REMOTE_DIR"
          echo "File      : $DOWNLOADED_FILENAME"
          echo "Size      : $DOWNLOADED_SIZE bytes"
          echo "SHA256    : $DOWNLOADED_SHA256"

          echo
          echo "Preparing SFTP commands..."

          cat > "$RUNNER_TEMP/sourceforge_upload.txt" <<EOF
          mkdir /home/frs/project-mistos/Android17
          mkdir ${REMOTE_DIR}
          put "${DOWNLOADED_FILE}" "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          ls -l "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$RUNNER_TEMP/sourceforge_upload.txt"

          echo
          echo "Uploading..."
          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$RUNNER_TEMP/sourceforge_upload.txt" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "SourceForge upload completed successfully."

      # ==========================================================
      # 7. Verify upload
      # ==========================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE FILE"
          echo "============================================================"

          SOURCEFORGE_HOST="frs.sourceforge.net"

          REMOTE_DIR="/home/frs/project-mistos/Android17/${DEVICE}"

          cat > "$RUNNER_TEMP/sourceforge_verify.txt" <<EOF
          ls -l "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$RUNNER_TEMP/sourceforge_verify.txt"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$RUNNER_TEMP/sourceforge_verify.txt" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "============================================================"
          echo "                 UPLOAD VERIFIED"
          echo "============================================================"

      # ==========================================================
      # 8. Cleanup - ALWAYS RUN
      # ==========================================================

      - name: Cleanup downloaded file
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          if [[ -d "$DOWNLOAD_DIR" ]]; then

            echo "Removing downloaded file..."

            rm -rf "$DOWNLOAD_DIR"

            echo "Downloaded file removed."

          else

            echo "Download directory does not exist."

          fi

          echo
          echo "Cleanup finished."

      # ==========================================================
      # 9. Final summary
      # ==========================================================

      - name: Final summary
        if: always()
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device : $DEVICE"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo "File   : $DOWNLOADED_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size   : $DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256 : $DOWNLOADED_SHA256"
          fi

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo
            echo "File:"
            echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/${DOWNLOADED_FILENAME}"
          fi

          echo
          echo "============================================================"
