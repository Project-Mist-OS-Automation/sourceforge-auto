name: Gofile → SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (example: raphael, bluejay, lisa, sweet, raven)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Download Gofile → Upload SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_HOST: frs.sourceforge.net
      SOURCEFORGE_BASE: /home/frs/project/project-mistos/Android17

      GOFILE_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING DEPENDENCIES"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            sshpass \
            file

          echo
          echo "Installed versions:"

          curl --version | head -n 1
          jq --version
          node --version
          sshpass -V 2>&1 | head -n 1
          file --version | head -n 1


      # ============================================================
      # PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/mistos"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          echo "WORK=$WORK" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "PREPARING WORKSPACE"
          echo "============================================================"

          echo "Workspace:"
          echo "$WORK"


      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          GOFILE_URL="${{ inputs.gofile_url }}"
          DEVICE="${{ inputs.device }}"

          echo "============================================================"
          echo "VALIDATING INPUTS"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "ERROR: Gofile URL is empty."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "ERROR: Device name is empty."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: Invalid device name:"
            echo "$DEVICE"
            echo
            echo "Allowed:"
            echo "A-Z a-z 0-9 . _ -"
            exit 1
          fi

          echo
          echo "Gofile URL:"
          echo "$GOFILE_URL"

          echo
          echo "Device:"
          echo "$DEVICE"

          echo "GOFILE_URL=$GOFILE_URL" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"


      # ============================================================
      # EXTRACT GOFILE ID
      # ============================================================

      - name: Extract Gofile ID
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE ID"
          echo "============================================================"

          GOFILE_ID=""

          if [[ "$GOFILE_URL" =~ /d/([^/?#]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"

          elif [[ "$GOFILE_URL" =~ /contents/([^/?#]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$GOFILE_ID" ]]; then
            echo
            echo "ERROR: Could not extract Gofile content ID."
            echo
            echo "URL:"
            echo "$GOFILE_URL"
            exit 1
          fi

          echo "Gofile ID:"
          echo "$GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD GOFILE WT SCRIPT
      # ============================================================

      - name: Get Gofile website-token script
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GET GOFILE WEBSITE TOKEN SCRIPT"
          echo "============================================================"

          WT_SCRIPT="$WORK/gofile_wt.js"

          URLS=(
            "https://gofile.io/js/wt.obf.js"
            "https://gofile.io/dist/js/wt.obf.js"
          )

          FOUND=0

          for URL in "${URLS[@]}"; do

            echo
            echo "Trying:"
            echo "$URL"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "$WT_SCRIPT" \
                --write-out "%{http_code}" \
                --connect-timeout 20 \
                --max-time 60 \
                -A "$GOFILE_USER_AGENT" \
                "$URL" \
                || true
            )"

            echo "HTTP: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]] &&
               [[ -s "$WT_SCRIPT" ]]; then

              SIZE="$(wc -c < "$WT_SCRIPT")"

              if (( SIZE > 1000 )); then

                echo
                echo "WT script downloaded."
                echo "WT script size: $SIZE bytes"

                FOUND=1
                break
              fi
            fi
          done

          if [[ "$FOUND" != "1" ]]; then
            echo
            echo "ERROR: Could not download Gofile WT script."
            exit 1
          fi


      # ============================================================
      # EXTRACT DYNAMIC WT SECRET
      # ============================================================

      - name: Extract Gofile WT secret
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE WEBSITE TOKEN SECRET"
          echo "============================================================"

          cat > "$WORK/extract_wt_secret.js" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const crypto = require("crypto");

          const scriptFile = process.argv[2];

          if (!scriptFile) {
            throw new Error("Missing script file");
          }

          const script = fs.readFileSync(scriptFile, "utf8");

          let rawHashInput = "";

          const probeUserAgent = "MistOSGofileUserAgent";
          const probeLanguage = "MistOSGofileLanguage";
          const probeToken = "MistOSGofileToken";

          const navigator = {
            userAgent: probeUserAgent,
            language: probeLanguage
          };

          const context = vm.createContext(
            {
              appdata: {},

              crypto: crypto.webcrypto,

              console: {
                error() {},
                log() {},
                warn() {}
              },

              Date,
              Math,
              navigator,
              URLSearchParams,

              window: {
                crypto: crypto.webcrypto,

                location: {
                  hostname: "gofile.io",
                  search: ""
                },

                navigator
              }
            },
            {
              name: "gofile-website-token"
            }
          );

          vm.runInContext(
            script,
            context,
            {
              timeout: 3000
            }
          );

          if (typeof context.generateWT !== "function") {
            throw new Error(
              "generateWT() was not found in wt.obf.js"
            );
          }

          context._sha256 = (input) => {
            rawHashInput = String(input);
            return "0".repeat(64);
          };

          vm.runInContext(
            `generateWT(${JSON.stringify(probeToken)})`,
            context,
            {
              timeout: 3000
            }
          );

          if (!rawHashInput) {
            throw new Error(
              "generateWT() did not call intercepted SHA-256"
            );
          }

          const expectedPrefix =
            `${probeUserAgent}::${probeLanguage}::${probeToken}::`;

          if (!rawHashInput.startsWith(expectedPrefix)) {
            throw new Error(
              "Unexpected Gofile WT hash input format: " +
              rawHashInput
            );
          }

          const remainder =
            rawHashInput.slice(expectedPrefix.length);

          const parts = remainder.split("::");

          if (parts.length < 2) {
            throw new Error(
              "Could not extract Gofile WT secret"
            );
          }

          const secret = parts.slice(1).join("::").trim();

          if (!secret) {
            throw new Error(
              "Extracted Gofile WT secret is empty"
            );
          }

          process.stdout.write(secret);
          NODE

          SECRET="$(
            node \
              "$WORK/extract_wt_secret.js" \
              "$WORK/gofile_wt.js"
          )"

          if [[ -z "$SECRET" ]]; then
            echo "ERROR: No Gofile WT secret found."
            exit 1
          fi

          echo
          echo "Gofile WT secret extracted successfully."

          {
            echo "GOFILE_WT_SECRET<<EOF"
            echo "$SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"


      # ============================================================
      # CREATE GOFILE GUEST ACCOUNT
      # ============================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CREATE GOFILE GUEST ACCOUNT"
          echo "============================================================"

          ACCOUNT_RESPONSE="$WORK/account.json"

          CURRENT_WINDOW="$(date +%s)"
          CURRENT_WINDOW=$(( CURRENT_WINDOW / 14400 ))

          echo "Current WT time window:"
          echo "$CURRENT_WINDOW"

          WT_INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::::${CURRENT_WINDOW}::${GOFILE_WT_SECRET}"

          WT="$(
            printf '%s' "$WT_INPUT" |
            sha256sum |
            awk '{print $1}'
          )"

          echo
          echo "Creating guest account..."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --output "$ACCOUNT_RESPONSE" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 90 \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer " \
              -H "X-Website-Token: ${WT}" \
              -H "X-BL: ${GOFILE_LANGUAGE}" \
              -H "Origin: https://gofile.io" \
              -H "Referer: https://gofile.io/" \
              -X POST \
              "https://api.gofile.io/accounts" \
              || true
          )"

          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then

            echo
            echo "ERROR: Gofile guest account creation failed."

            jq . "$ACCOUNT_RESPONSE" 2>/dev/null ||
              cat "$ACCOUNT_RESPONSE"

            exit 1
          fi

          API_STATUS="$(
            jq -r '.status // empty' "$ACCOUNT_RESPONSE" 2>/dev/null ||
            true
          )"

          echo "API status: $API_STATUS"

          if [[ "$API_STATUS" != "ok" ]]; then

            echo
            echo "ERROR: Gofile account API did not return status=ok."

            jq . "$ACCOUNT_RESPONSE" 2>/dev/null ||
              cat "$ACCOUNT_RESPONSE"

            exit 1
          fi

          GOFILE_TOKEN="$(
            jq -r '.data.token // empty' "$ACCOUNT_RESPONSE"
          )"

          if [[ -z "$GOFILE_TOKEN" ]]; then
            echo
            echo "ERROR: Gofile account token is missing."
            exit 1
          fi

          echo
          echo "Gofile guest account created successfully."

          echo "GOFILE_TOKEN=$GOFILE_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # GET GOFILE CONTENT
      # ============================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GET GOFILE CONTENT"
          echo "============================================================"

          RESPONSE="$WORK/gofile_content.json"

          SUCCESS=0

          CURRENT_WINDOW="$(date +%s)"
          CURRENT_WINDOW=$(( CURRENT_WINDOW / 14400 ))

          for OFFSET in 0 1 2; do

            WINDOW=$(( CURRENT_WINDOW - OFFSET ))

            echo
            echo "Trying WT time window: $WINDOW"

            WT_INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::${GOFILE_TOKEN}::${WINDOW}::${GOFILE_WT_SECRET}"

            WT="$(
              printf '%s' "$WT_INPUT" |
              sha256sum |
              awk '{print $1}'
            )"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --compressed \
                --output "$RESPONSE" \
                --write-out "%{http_code}" \
                --connect-timeout 30 \
                --max-time 90 \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                -H "X-Website-Token: ${WT}" \
                -H "X-BL: ${GOFILE_LANGUAGE}" \
                -H "Origin: https://gofile.io" \
                -H "Referer: https://gofile.io/" \
                -G \
                --data-urlencode "contentFilter=" \
                --data-urlencode "page=1" \
                --data-urlencode "pageSize=1000" \
                --data-urlencode "sortField=name" \
                --data-urlencode "sortDirection=1" \
                "https://api.gofile.io/contents/${GOFILE_ID}" \
                || true
            )"

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]]; then

              STATUS="$(
                jq -r '.status // empty' "$RESPONSE" 2>/dev/null ||
                true
              )"

              echo "API status: $STATUS"

              if [[ "$STATUS" == "ok" ]]; then

                SUCCESS=1

                echo
                echo "GOFILE CONTENT FOUND"
                echo

                jq . "$RESPONSE"

                break
              fi

              echo
              echo "Gofile returned HTTP 200 but API status was not ok."

              jq . "$RESPONSE" 2>/dev/null ||
                cat "$RESPONSE"

            elif [[ "$HTTP_CODE" == "429" ]]; then

              echo
              echo "Gofile rate limit reached."
              echo "Waiting before retry..."

              sleep 10

            else

              echo
              echo "Gofile response:"

              jq . "$RESPONSE" 2>/dev/null ||
                cat "$RESPONSE"

            fi

            sleep 2

          done

          if [[ "$SUCCESS" != "1" ]]; then

            echo
            echo "============================================================"
            echo "GOFILE CONTENT REQUEST FAILED"
            echo "============================================================"

            cat "$RESPONSE" 2>/dev/null || true

            exit 1
          fi


      # ============================================================
      # EXTRACT ACTUAL FILE
      # ============================================================

      - name: Extract Gofile file information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE FILE INFORMATION"
          echo "============================================================"

          RESPONSE="$WORK/gofile_content.json"

          TYPE="$(
            jq -r '.data.type // empty' "$RESPONSE"
          )"

          echo "Content type: ${TYPE:-unknown}"

          if [[ "$TYPE" == "file" ]]; then

            FILE_JSON="$(
              jq -c '.data' "$RESPONSE"
            )"

          else

            CHILDREN_TYPE="$(
              jq -r '.data.children | type // empty' "$RESPONSE"
            )"

            if [[ "$CHILDREN_TYPE" == "object" ]]; then

              FILE_JSON="$(
                jq -c '
                  [
                    .data.children[]
                    | select(.type == "file")
                  ]
                  | if length == 1
                    then .[0]
                    else
                      error(
                        "Expected exactly one file, found \(length)"
                      )
                    end
                ' "$RESPONSE"
              )"

            elif [[ "$CHILDREN_TYPE" == "array" ]]; then

              FILE_JSON="$(
                jq -c '
                  [
                    .data.children[]
                    | select(.type == "file")
                  ]
                  | if length == 1
                    then .[0]
                    else
                      error(
                        "Expected exactly one file, found \(length)"
                      )
                    end
                ' "$RESPONSE"
              )"

            else

              echo
              echo "ERROR: No usable Gofile file found."
              exit 1

            fi
          fi

          GOFILE_FILENAME="$(
            jq -r '.name // empty' <<< "$FILE_JSON"
          )"

          GOFILE_LINK="$(
            jq -r '.link // empty' <<< "$FILE_JSON"
          )"

          GOFILE_SIZE="$(
            jq -r '.size // 0' <<< "$FILE_JSON"
          )"

          if [[ -z "$GOFILE_FILENAME" ]]; then
            echo "ERROR: Gofile filename is missing."
            exit 1
          fi

          if [[ -z "$GOFILE_LINK" ]]; then
            echo "ERROR: Gofile download link is missing."
            exit 1
          fi

          GOFILE_FILENAME="$(basename -- "$GOFILE_FILENAME")"

          if [[ "$GOFILE_FILENAME" == "." ||
                "$GOFILE_FILENAME" == ".." ||
                "$GOFILE_FILENAME" == */* ]]; then

            echo "ERROR: Unsafe filename:"
            echo "$GOFILE_FILENAME"

            exit 1
          fi

          echo
          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_SIZE bytes"

          echo
          echo "Direct link:"
          echo "$GOFILE_LINK"

          echo "GOFILE_FILENAME=$GOFILE_FILENAME" >> "$GITHUB_ENV"
          echo "GOFILE_LINK=$GOFILE_LINK" >> "$GITHUB_ENV"
          echo "GOFILE_SIZE=$GOFILE_SIZE" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD ACTUAL FILE
      # ============================================================

      - name: Download file from Gofile
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DOWNLOAD FILE FROM GOFILE"
          echo "============================================================"

          DOWNLOAD="$WORK/$GOFILE_FILENAME"

          COOKIE_JAR="$WORK/gofile.cookies"
          PAGE_RESPONSE="$WORK/gofile_page.html"
          DOWNLOAD_HEADERS="$WORK/download_headers.txt"

          rm -f \
            "$COOKIE_JAR" \
            "$PAGE_RESPONSE" \
            "$DOWNLOAD_HEADERS" \
            "$DOWNLOAD"

          echo
          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_SIZE bytes"

          # --------------------------------------------------------
          # Establish Gofile accountToken cookie.
          # --------------------------------------------------------

          echo
          echo "Opening Gofile share page..."

          PAGE_HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --cookie "accountToken=${GOFILE_TOKEN}" \
              --cookie-jar "$COOKIE_JAR" \
              --output "$PAGE_RESPONSE" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 90 \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: ${GOFILE_LANGUAGE},en;q=0.9" \
              -H "Referer: https://gofile.io/" \
              "$GOFILE_URL" \
              || true
          )"

          echo "Share page HTTP status: $PAGE_HTTP_CODE"

          # Explicitly create the accountToken cookie as well.
          printf '# Netscape HTTP Cookie File\n' > "$COOKIE_JAR"

          printf 'gofile.io\tTRUE\t/\tFALSE\t0\taccountToken\t%s\n' \
            "$GOFILE_TOKEN" >> "$COOKIE_JAR"

          echo
          echo "Gofile accountToken cookie prepared."

          # --------------------------------------------------------
          # Download actual file.
          # --------------------------------------------------------

          echo
          echo "Downloading actual file..."

          HTTP_CODE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --compressed \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 7200 \
              --cookie "$COOKIE_JAR" \
              --dump-header "$DOWNLOAD_HEADERS" \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: */*" \
              -H "Accept-Language: ${GOFILE_LANGUAGE},en;q=0.9" \
              -H "Authorization: Bearer ${GOFILE_TOKEN}" \
              -H "Referer: ${GOFILE_URL}" \
              -H "Origin: https://gofile.io" \
              --output "$DOWNLOAD" \
              --write-out "%{http_code}" \
              "$GOFILE_LINK"
          )"

          echo
          echo "Download HTTP status:"
          echo "$HTTP_CODE"

          if [[ ! -f "$DOWNLOAD" ]]; then
            echo
            echo "ERROR: Downloaded file does not exist."
            exit 1
          fi

          ACTUAL_SIZE="$(
            stat -c '%s' "$DOWNLOAD"
          )"

          echo
          echo "Downloaded size:"
          echo "$ACTUAL_SIZE bytes"

          FILE_TYPE="$(
            file -b "$DOWNLOAD"
          )"

          echo
          echo "Detected file type:"
          echo "$FILE_TYPE"

          # --------------------------------------------------------
          # Reject Gofile HTML page.
          # --------------------------------------------------------

          if echo "$FILE_TYPE" |
             grep -Eiq 'HTML|XML|JSON|ASCII text|Unicode text'; then

            echo
            echo "============================================================"
            echo "ERROR: GOFILE RETURNED HTML/ERROR PAGE"
            echo "============================================================"

            echo
            echo "First 1000 bytes:"

            head -c 1000 "$DOWNLOAD" |
              strings ||
              true

            echo
            echo "Response headers:"

            cat "$DOWNLOAD_HEADERS" 2>/dev/null || true

            exit 1
          fi

          # --------------------------------------------------------
          # Minimum size.
          # --------------------------------------------------------

          if (( ACTUAL_SIZE < 10240 )); then

            echo
            echo "ERROR: Downloaded file is suspiciously small."

            exit 1
          fi

          # --------------------------------------------------------
          # SHA256.
          # --------------------------------------------------------

          echo
          echo "Calculating SHA256..."

          SHA256="$(
            sha256sum "$DOWNLOAD" |
            awk '{print $1}'
          )"

          echo
          echo "SHA256:"
          echo "$SHA256"

          echo
          echo "Gofile download verified."

          echo "DOWNLOADED_FILE=$DOWNLOAD" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SIZE=$ACTUAL_SIZE" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SHA256=$SHA256" >> "$GITHUB_ENV"


      # ============================================================
      # SOURCEFORGE CREDENTIAL CHECK
      # ============================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHECK SOURCEFORGE CREDENTIALS"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "ERROR: SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "ERROR: SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "SourceForge username:"
          echo "$SOURCEFORGE_USER"

          echo
          echo "SourceForge password:"
          echo "configured"


      # ============================================================
      # SOURCEFORGE AUTHENTICATION TEST
      # ============================================================

      - name: Test SourceForge authentication
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "TEST SOURCEFORGE AUTHENTICATION"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          echo
          echo "Connecting to:"
          echo "$SOURCEFORGE_HOST"

          echo
          echo "Authentication methods:"
          echo "  keyboard-interactive"
          echo "  password"

          sshpass -e \
            ssh \
              -T \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
              "pwd" \
              || {

                echo
                echo "============================================================"
                echo "SOURCEFORGE AUTHENTICATION FAILED"
                echo "============================================================"
                echo
                echo "SourceForge rejected password authentication."
                echo
                echo "If your SourceForge account has 2FA enabled,"
                echo "a password alone is not sufficient for this"
                echo "non-interactive GitHub Actions workflow."
                echo
                echo "In that case, use an SSH key for SourceForge."
                echo

                exit 1
              }

          echo
          echo "SourceForge authentication successful."


      # ============================================================
      # CHECK / CREATE DEVICE DIRECTORY
      # ============================================================

      - name: Check or create SourceForge device directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SOURCEFORGE DEVICE DIRECTORY"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          DEVICE_DIR="$SOURCEFORGE_BASE/$DEVICE"

          echo
          echo "Device directory:"
          echo "$DEVICE_DIR"

          # --------------------------------------------------------
          # Check whether directory exists.
          # --------------------------------------------------------

          if sshpass -e \
            ssh \
              -T \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=keyboard-interactive,password \
              "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
              "test -d '$DEVICE_DIR'"; then

            echo
            echo "Device directory already exists."

          else

            echo
            echo "Device directory does not exist."
            echo "Creating:"
            echo "$DEVICE_DIR"

            sshpass -e \
              ssh \
                -T \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=keyboard-interactive,password \
                "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
                "mkdir -p '$DEVICE_DIR'"

            echo
            echo "Device directory created."

          fi


      # ============================================================
      # UPLOAD TO SOURCEFORGE
      #
      # For large ROM files, rsync is preferred by SourceForge.
      # It can resume interrupted transfers.
      # ============================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "UPLOAD TO SOURCEFORGE"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          REMOTE_PATH="$SOURCEFORGE_BASE/$DEVICE/$GOFILE_FILENAME"

          echo
          echo "Local file:"
          echo "$DOWNLOADED_FILE"

          echo
          echo "Remote file:"
          echo "$REMOTE_PATH"

          echo
          echo "Uploading..."

          sshpass -e \
            rsync \
              -avP \
              --partial \
              --progress \
              -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password" \
              "$DOWNLOADED_FILE" \
              "$SOURCEFORGE_USER@$SOURCEFORGE_HOST:$REMOTE_PATH"

          echo
          echo "SourceForge upload completed."


      # ============================================================
      # VERIFY UPLOAD
      # ============================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          REMOTE_PATH="$SOURCEFORGE_BASE/$DEVICE/$GOFILE_FILENAME"

          REMOTE_SIZE="$(
            sshpass -e \
              ssh \
                -T \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=keyboard-interactive,password \
                "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
                "stat -c '%s' '$REMOTE_PATH'"
          )"

          echo
          echo "Local size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "Remote size:"
          echo "$REMOTE_SIZE bytes"

          if [[ "$REMOTE_SIZE" != "$DOWNLOADED_SIZE" ]]; then

            echo
            echo "ERROR: SourceForge file size does not match."

            exit 1
          fi

          echo
          echo "UPLOAD VERIFIED SUCCESSFULLY."


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Transfer summary
        if: success()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "             MISTOS TRANSFER COMPLETE"
          echo "============================================================"

          echo
          echo "Device:"
          echo "  $DEVICE"

          echo
          echo "Filename:"
          echo "  $GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "  $DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "  $DOWNLOADED_SHA256"

          echo
          echo "SourceForge directory:"
          echo "  https://sourceforge.net/projects/project-mistos/files/Android17/$DEVICE/"

          echo
          echo "File:"
          echo "  https://sourceforge.net/projects/project-mistos/files/Android17/$DEVICE/$GOFILE_FILENAME"

          echo
          echo "============================================================"


      # ============================================================
      # ALWAYS CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "CLEANUP"
          echo "============================================================"

          if [[ -n "${WORK:-}" ]]; then
            echo "Removing:"
            echo "$WORK"

            rm -rf "$WORK"
          fi

          unset SSHPASS
          unset GOFILE_TOKEN
          unset GOFILE_WT_SECRET

          echo
          echo "Cleanup completed."
