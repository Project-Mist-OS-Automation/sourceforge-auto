      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          SOURCEFORGE_HOST="frs.sourceforge.net"

          BASE_DIR="/home/frs/project-mistos/Android17"
          DEVICE_DIR="${BASE_DIR}/${DEVICE}"

          echo "Host        : $SOURCEFORGE_HOST"
          echo "User        : $SOURCEFORGE_USER"
          echo "Base dir    : $BASE_DIR"
          echo "Device dir  : $DEVICE_DIR"
          echo "File        : $DOWNLOADED_FILENAME"
          echo "Size        : $DOWNLOADED_SIZE bytes"
          echo "SHA256      : $DOWNLOADED_SHA256"
          echo

          # ------------------------------------------------------
          # Create temporary SFTP script
          # ------------------------------------------------------

          SFTP_SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$SFTP_SCRIPT" <<EOF
          cd ${BASE_DIR}
          ls
          bye
          EOF

          chmod 600 "$SFTP_SCRIPT"

          echo "Checking SourceForge Android17 directory..."
          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SFTP_SCRIPT" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "Android17 directory is accessible."

          # ------------------------------------------------------
          # Check whether device directory exists
          # ------------------------------------------------------

          CHECK_SCRIPT="$RUNNER_TEMP/sourceforge_check_device.txt"

          cat > "$CHECK_SCRIPT" <<EOF
          cd ${BASE_DIR}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK_SCRIPT"

          echo
          echo "Checking device directory:"
          echo "${DEVICE}"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$CHECK_SCRIPT" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}" \
            > "$RUNNER_TEMP/device_check.log" 2>&1

          CHECK_STATUS=$?

          set -e

          if [[ "$CHECK_STATUS" -eq 0 ]]; then

            echo
            echo "============================================================"
            echo "DEVICE DIRECTORY ALREADY EXISTS"
            echo "============================================================"

            echo "Using:"
            echo "${DEVICE_DIR}"

          else

            echo
            echo "============================================================"
            echo "DEVICE DIRECTORY DOES NOT EXIST"
            echo "============================================================"

            echo "Creating:"
            echo "${DEVICE_DIR}"

            CREATE_SCRIPT="$RUNNER_TEMP/sourceforge_create_device.txt"

            cat > "$CREATE_SCRIPT" <<EOF
          cd ${BASE_DIR}
          mkdir ${DEVICE}
          ls
          bye
          EOF

            chmod 600 "$CREATE_SCRIPT"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -oServerAliveInterval=30 \
              -oServerAliveCountMax=10 \
              -b "$CREATE_SCRIPT" \
              "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

            echo
            echo "Device directory created successfully."

          fi

          # ------------------------------------------------------
          # Upload file
          # ------------------------------------------------------

          echo
          echo "============================================================"
          echo "                       UPLOAD"
          echo "============================================================"

          UPLOAD_SCRIPT="$RUNNER_TEMP/sourceforge_put.txt"

          cat > "$UPLOAD_SCRIPT" <<EOF
          cd ${DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${DOWNLOADED_FILENAME}"
          ls -l "${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$UPLOAD_SCRIPT"

          echo "Uploading:"
          echo "${DOWNLOADED_FILENAME}"

          echo
          echo "Destination:"
          echo "${DEVICE_DIR}/${DOWNLOADED_FILENAME}"

          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$UPLOAD_SCRIPT" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "============================================================"
          echo "                  UPLOAD SUCCESSFUL"
          echo "============================================================"
