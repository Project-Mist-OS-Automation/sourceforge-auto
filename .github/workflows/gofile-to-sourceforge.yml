name: Gofile → SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (example: raphael, bluejay, lisa, sweet)"
        required: true
        type: string

jobs:
  transfer:
    name: Download from Gofile and upload to SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Prepare environment
      # ---------------------------------------------------------
      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Preparing environment"
          echo "============================================================"

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            wget \
            jq \
            rsync \
            ca-certificates \
            python3

          mkdir -p "$RUNNER_TEMP/gofile-transfer"
          mkdir -p "$RUNNER_TEMP/gofile-transfer/download"

          echo "Workspace:"
          df -h

          echo
          echo "Environment ready."

      # ---------------------------------------------------------
      # 3. Validate user input
      # ---------------------------------------------------------
      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Validating inputs"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          # Only allow safe directory names.
          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name: $DEVICE"
            echo "Use names such as: raphael, bluejay, lisa, sweet"
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"
          echo
          echo "SourceForge destination:"
          echo "https://sourceforge.net/projects/${SOURCEFORGE_PROJECT}/files/${SOURCEFORGE_BASE_DIR}/${DEVICE}/"

      # ---------------------------------------------------------
      # 4. Download from Gofile
      # ---------------------------------------------------------
      - name: Download file from Gofile
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DOWNLOAD_DIR: ${{ runner.temp }}/gofile-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Downloading from Gofile"
          echo "============================================================"

          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"

          cd "$DOWNLOAD_DIR"

          echo "URL:"
          echo "$GOFILE_URL"
          echo

          echo "Requesting Gofile URL..."
          echo

          # First attempt:
          # Gofile direct download links normally redirect to the
          # actual file server.
          wget \
            --content-disposition \
            --trust-server-names \
            --show-progress \
            --progress=dot:giga \
            --timeout=60 \
            --tries=5 \
            --waitretry=5 \
            --retry-connrefused \
            "$GOFILE_URL"

          echo
          echo "Download command completed."

          echo
          echo "Downloaded files:"
          find "$DOWNLOAD_DIR" -maxdepth 1 -type f -printf '%f\t%s bytes\n'

      # ---------------------------------------------------------
      # 5. Find and validate downloaded file
      # ---------------------------------------------------------
      - name: Validate downloaded file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/gofile-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Validating downloaded file"
          echo "============================================================"

          mapfile -t FILES < <(
            find "$DOWNLOAD_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%p\n'
          )

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::No file was downloaded."
            exit 1
          fi

          if [[ "${#FILES[@]}" -gt 1 ]]; then
            echo "::error::More than one file was downloaded:"
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          FILE="${FILES[0]}"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          SIZE=$(stat -c '%s' "$FILE")
          HUMAN_SIZE=$(du -h "$FILE" | cut -f1)
          FILENAME=$(basename "$FILE")
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')

          echo "Filename : $FILENAME"
          echo "Size     : $SIZE bytes"
          echo "Size     : $HUMAN_SIZE"
          echo "SHA256   : $SHA256"
          echo

          echo "File validation successful."

          {
            echo "DOWNLOADED_FILE=$FILE"
            echo "DOWNLOADED_FILENAME=$FILENAME"
            echo "DOWNLOADED_SIZE=$SIZE"
            echo "DOWNLOADED_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Install SourceForge upload tools
      # ---------------------------------------------------------
      - name: Prepare SourceForge uploader
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Preparing SourceForge uploader"
          echo "============================================================"

          # SourceForge supports uploads over SFTP.
          # OpenSSH is used instead of depending on a third-party
          # uploader.

          sudo apt-get install -y openssh-client

          echo
          echo "SSH/SFTP version:"
          sftp -V 2>&1 | head -n 1 || true

          echo
          echo "SourceForge uploader ready."

      # ---------------------------------------------------------
      # 7. Upload to SourceForge
      # ---------------------------------------------------------
      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_TOKEN: ${{ secrets.SOURCEFORGE_TOKEN }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Uploading to SourceForge"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_TOKEN:-}" ]]; then
            echo "::error::SOURCEFORGE_TOKEN GitHub secret is not configured."
            exit 1
          fi

          SOURCEFORGE_HOST="frs.sourceforge.net"
          SOURCEFORGE_USER="yusufnoor786"

          REMOTE_DIR="/home/frs/project-mistos/Android17/${DEVICE}"

          echo "Project       : project-mistos"
          echo "Device        : ${DEVICE}"
          echo "Remote host   : ${SOURCEFORGE_HOST}"
          echo "Remote folder : ${REMOTE_DIR}"
          echo "Local file    : ${DOWNLOADED_FILENAME}"
          echo "File size     : ${DOWNLOADED_SIZE} bytes"
          echo "SHA256        : ${DOWNLOADED_SHA256}"
          echo

          echo "Connecting to SourceForge..."

          cat > "$RUNNER_TEMP/upload_commands.txt" <<EOF
          -mkdir /home/frs/project-mistos/Android17
          -mkdir ${REMOTE_DIR}
          put "${DOWNLOADED_FILE}" "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          ls -l "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$RUNNER_TEMP/upload_commands.txt"

          echo
          echo "Starting upload..."
          echo

          SFTP_PASSWORD="$SOURCEFORGE_TOKEN" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$RUNNER_TEMP/upload_commands.txt" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "============================================================"
          echo "Upload completed"
          echo "============================================================"

      # ---------------------------------------------------------
      # 8. Verify remote file
      # ---------------------------------------------------------
      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_TOKEN: ${{ secrets.SOURCEFORGE_TOKEN }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "Verifying SourceForge upload"
          echo "============================================================"

          SOURCEFORGE_HOST="frs.sourceforge.net"
          SOURCEFORGE_USER="yusufnoor786"
          REMOTE_DIR="/home/frs/project-mistos/Android17/${DEVICE}"

          cat > "$RUNNER_TEMP/verify_commands.txt" <<EOF
          ls -l "${REMOTE_DIR}/${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$RUNNER_TEMP/verify_commands.txt"

          SFTP_PASSWORD="$SOURCEFORGE_TOKEN" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$RUNNER_TEMP/verify_commands.txt" \
            "${SOURCEFORGE_USER}@${SOURCEFORGE_HOST}"

          echo
          echo "Remote file exists."
          echo
          echo "SourceForge URL:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/${DOWNLOADED_FILENAME}"

      # ---------------------------------------------------------
      # 9. Cleanup downloaded file
      # ---------------------------------------------------------
      - name: Cleanup downloaded file
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/gofile-transfer/download
        run: |
          set +e

          echo "============================================================"
          echo "Cleaning up"
          echo "============================================================"

          if [[ -d "$DOWNLOAD_DIR" ]]; then
            echo "Removing downloaded files..."

            rm -rf "$DOWNLOAD_DIR"

            echo "Download directory removed."
          else
            echo "Download directory already removed."
          fi

          echo
          echo "Checking cleanup..."

          if [[ ! -d "$DOWNLOAD_DIR" ]]; then
            echo "Cleanup successful."
          else
            echo "::warning::Download directory still exists."
          fi

      # ---------------------------------------------------------
      # 10. Final status
      # ---------------------------------------------------------
      - name: Transfer summary
        if: always()
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          echo
          echo "============================================================"
          echo "TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device: ${DEVICE}"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo "File: ${DOWNLOADED_FILENAME}"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size: ${DOWNLOADED_SIZE} bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256: ${DOWNLOADED_SHA256}"
          fi

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/"

          echo
          echo "============================================================"
