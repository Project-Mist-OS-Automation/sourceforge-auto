name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile URL (example: https://gofile.io/d/OXHOeYwi)"
        required: true
        type: string

      device:
        description: "Device name (raphael, bluejay, lisa, sweet, raven, etc.)"
        required: true
        type: string

jobs:
  transfer:
    name: Gofile → SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

      # IMPORTANT:
      # This User-Agent must remain identical for:
      # 1. WT generation
      # 2. Gofile account creation
      # 3. Gofile content request
      # 4. File download
      GOFILE_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ==========================================================
      # 1. PREPARE ENVIRONMENT
      # ==========================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              MISTOS GOFILE → SOURCEFORGE"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            file \
            sshpass \
            openssh-client \
            ca-certificates \
            python3 \
            nodejs

          mkdir -p "$RUNNER_TEMP/mistos"
          mkdir -p "$RUNNER_TEMP/mistos/download"
          mkdir -p "$RUNNER_TEMP/mistos/logs"

          echo
          echo "Node:"
          node --version

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Dependencies installed."

      # ==========================================================
      # 2. VALIDATE INPUT
      # ==========================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          if [[ "$DEVICE" == "." || "$DEVICE" == ".." ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ "$DEVICE" == *"/"* || "$DEVICE" == *"\\"* ]]; then
            echo "::error::Device name cannot contain / or \\."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name."
            echo "Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"

      # ==========================================================
      # 3. EXTRACT GOFILE ID
      # ==========================================================

      - name: Extract Gofile ID
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  GOFILE ID EXTRACTION"
          echo "============================================================"

          CLEAN_URL="${GOFILE_URL%%\?*}"
          CLEAN_URL="${CLEAN_URL%/}"

          if [[ "$CLEAN_URL" =~ /d/([^/]+)$ ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Gofile ID."
            echo
            echo "Expected format:"
            echo "https://gofile.io/d/XXXXXXXX"
            exit 1
          fi

          echo "Gofile ID: $GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. GET CURRENT GOFILE WT SCRIPT
      # ==========================================================

      - name: Get current Gofile WT script
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             GET GOFILE WEBSITE TOKEN SCRIPT"
          echo "============================================================"

          WT_JS="$RUNNER_TEMP/mistos/gofile_wt.js"
          HOMEPAGE="$RUNNER_TEMP/mistos/gofile.html"

          echo "Downloading Gofile homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 60 \
            -A "$GOFILE_USER_AGENT" \
            -H "Accept: text/html,application/xhtml+xml" \
            "https://gofile.io/" \
            -o "$HOMEPAGE"

          echo
          echo "Searching for current WT script..."

          DISCOVERED_URL="$(
            python3 - "$HOMEPAGE" <<'PY'
          import re
          import sys
          from urllib.parse import urljoin

          html = open(
              sys.argv[1],
              encoding="utf-8",
              errors="ignore"
          ).read()

          patterns = [
              r'<script[^>]+src=["\']([^"\']*wt[^"\']*\.js)["\']',
              r'<script[^>]+src=["\']([^"\']*wt\.obf\.js)["\']',
          ]

          for pattern in patterns:
              match = re.search(pattern, html, re.I)

              if match:
                  print(
                      urljoin(
                          "https://gofile.io/",
                          match.group(1)
                      )
                  )
                  break
          PY
          )"

          echo "Discovered URL:"
          echo "${DISCOVERED_URL:-<not found>}"

          URLS=()

          if [[ -n "$DISCOVERED_URL" ]]; then
            URLS+=("$DISCOVERED_URL")
          fi

          URLS+=(
            "https://gofile.io/js/wt.obf.js"
            "https://gofile.io/dist/js/wt.obf.js"
          )

          FOUND=0

          for URL in "${URLS[@]}"; do

            echo
            echo "Trying:"
            echo "$URL"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 30 \
                --max-time 60 \
                --output "$WT_JS" \
                --write-out "%{http_code}" \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/javascript,text/javascript,*/*;q=0.8" \
                -H "Referer: https://gofile.io/" \
                "$URL" \
                || true
            )"

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]] &&
               [[ -s "$WT_JS" ]]; then

              if ! head -c 200 "$WT_JS" |
                grep -qiE '<html|<!doctype'; then

                FOUND=1

                echo
                echo "WT script downloaded successfully."
                echo "URL: $URL"

                break
              fi
            fi

          done

          if [[ "$FOUND" -ne 1 ]]; then
            echo
            echo "::error::Unable to download Gofile WT script."
            exit 1
          fi

          echo
          echo "WT script size:"
          wc -c "$WT_JS"

          echo "GOFILE_WT_SCRIPT=$WT_JS" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. CREATE NODE WT EXTRACTOR
      # ==========================================================

      - name: Create WT extractor
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              PREPARE GOFILE WT EXTRACTOR"
          echo "============================================================"

          cat > "$RUNNER_TEMP/mistos/extract_wt.js" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const crypto = require("crypto");

          const scriptFile = process.argv[2];

          if (!scriptFile) {
            console.error("Missing WT script path.");
            process.exit(1);
          }

          const script = fs.readFileSync(
            scriptFile,
            "utf8"
          );

          let rawHashInput;

          const probeUserAgent =
            "MistOSGofileUserAgent";

          const probeLanguage =
            "MistOSGofileLanguage";

          const probeToken =
            "MistOSGofileToken";

          const navigator = {
            userAgent: probeUserAgent,
            language: probeLanguage
          };

          /*
           * This matches the current Gofile implementation:
           *
           * crypto.webcrypto
           * window.crypto
           * navigator.userAgent
           * navigator.language
           * window.location
           */

          const context = vm.createContext(
            {
              appdata: {},

              crypto: crypto.webcrypto,

              console: {
                error: () => {},
                log: () => {},
                warn: () => {}
              },

              Date,
              Math,
              navigator,
              URLSearchParams,

              window: {
                crypto: crypto.webcrypto,

                location: {
                  hostname: "gofile.io",
                  search: ""
                },

                navigator
              }
            },
            {
              name: "gofile-website-token"
            }
          );

          /*
           * Execute the actual obfuscated Gofile script.
           */

          try {

            vm.runInContext(
              script,
              context,
              {
                timeout: 5000
              }
            );

          } catch (error) {

            /*
             * Some browser-only code may fail after generateWT()
             * has already been defined.
             */

            if (
              typeof context.generateWT !== "function"
            ) {

              console.error(
                "Gofile WT script initialization failed:"
              );

              console.error(
                error.message
              );

              process.exit(2);
            }
          }

          if (
            typeof context.generateWT !== "function"
          ) {

            console.error(
              "ERROR: generateWT() was not found."
            );

            process.exit(3);
          }

          /*
           * IMPORTANT:
           *
           * The Gofile WT script calls _sha256().
           *
           * We intercept that call to obtain:
           *
           * UserAgent::Language::AccountToken::Window::Secret
           */

          context._sha256 = (input) => {

            rawHashInput = String(input);

            return "0".repeat(64);
          };

          /*
           * Execute Gofile's actual generator.
           */

          try {

            vm.runInContext(
              `generateWT(${JSON.stringify(probeToken)})`,
              context,
              {
                timeout: 5000
              }
            );

          } catch (error) {

            console.error(
              "generateWT() execution failed:"
            );

            console.error(
              error.message
            );

            process.exit(4);
          }

          if (!rawHashInput) {

            console.error(
              "ERROR: Gofile WT generator did not hash any input."
            );

            process.exit(5);
          }

          const expectedPrefix =
            `${probeUserAgent}::${probeLanguage}::${probeToken}::`;

          if (
            !rawHashInput.startsWith(expectedPrefix)
          ) {

            console.error(
              "ERROR: Unsupported Gofile WT format."
            );

            console.error(
              "Unexpected hash-input prefix."
            );

            process.exit(6);
          }

          const remainder =
            rawHashInput.slice(
              expectedPrefix.length
            );

          const parts =
            remainder.split("::");

          if (parts.length < 2) {

            console.error(
              "ERROR: Could not parse Gofile WT input."
            );

            process.exit(7);
          }

          /*
           * parts[0] = time window
           * parts[1..] = embedded secret
           */

          const timeWindow =
            parts.shift();

          const secret =
            parts.join("::").trim();

          if (!secret) {

            console.error(
              "ERROR: Gofile WT secret is empty."
            );

            process.exit(8);
          }

          console.error(
            `Detected WT time window: ${timeWindow}`
          );

          /*
           * stdout ONLY contains the secret.
           */

          process.stdout.write(secret);
          NODE

          echo "WT extractor created."

      # ==========================================================
      # 6. EXTRACT GOFILE WT SECRET
      # ==========================================================

      - name: Extract Gofile WT secret
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                EXTRACT GOFILE WT SECRET"
          echo "============================================================"

          SECRET="$(
            node \
              "$RUNNER_TEMP/mistos/extract_wt.js" \
              "$GOFILE_WT_SCRIPT"
          )"

          if [[ -z "$SECRET" ]]; then
            echo "::error::Failed to extract Gofile WT secret."
            exit 1
          fi

          echo "::add-mask::$SECRET"

          echo "GOFILE_WT_SECRET=$SECRET" >> "$GITHUB_ENV"

          echo
          echo "Gofile WT secret successfully extracted."

      # ==========================================================
      # 7. CREATE GUEST ACCOUNT
      # ==========================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              CREATE GOFILE GUEST ACCOUNT"
          echo "============================================================"

          RESPONSE="$RUNNER_TEMP/mistos/logs/account.json"

          echo "Generating website token for guest account..."

          # IMPORTANT:
          #
          # Account creation uses an EMPTY account token.
          #
          # raw =
          # UserAgent::Language::::TimeWindow::Secret

          WT="$(
            python3 <<'PY'
          import hashlib
          import os
          import time

          ua = os.environ["GOFILE_USER_AGENT"]
          language = os.environ["GOFILE_LANGUAGE"]
          secret = os.environ["GOFILE_WT_SECRET"]

          window = int(time.time()) // 14400

          raw = (
              f"{ua}::"
              f"{language}::"
              f"::{window}::"
              f"{secret}"
          )

          token = hashlib.sha256(
              raw.encode("utf-8")
          ).hexdigest()

          print(token)
          PY
          )"

          echo "::add-mask::$WT"

          echo "Guest-account website token generated."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 60 \
              --output "$RESPONSE" \
              --write-out "%{http_code}" \
              -X POST \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer " \
              -H "X-Website-Token: $WT" \
              -H "X-BL: $GOFILE_LANGUAGE" \
              -H "Origin: https://gofile.io" \
              -H "Referer: https://gofile.io/" \
              "https://api.gofile.io/accounts" \
              || true
          )"

          echo
          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then

            echo
            echo "Gofile account response:"
            jq . "$RESPONSE" 2>/dev/null ||
              cat "$RESPONSE"

            exit 1
          fi

          STATUS="$(
            jq -r '.status // empty' "$RESPONSE"
          )"

          if [[ "$STATUS" != "ok" ]]; then

            echo
            jq . "$RESPONSE"

            exit 1
          fi

          GOFILE_TOKEN="$(
            jq -r '.data.token // empty' "$RESPONSE"
          )"

          if [[ -z "$GOFILE_TOKEN" ]]; then

            echo "::error::Gofile did not return an account token."

            exit 1
          fi

          echo "::add-mask::$GOFILE_TOKEN"

          echo "GOFILE_TOKEN=$GOFILE_TOKEN" >> "$GITHUB_ENV"

          echo
          echo "Gofile guest account created successfully."

      # ==========================================================
      # 8. GET GOFILE CONTENT
      # ==========================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                 GET GOFILE CONTENT"
          echo "============================================================"

          RESPONSE="$RUNNER_TEMP/mistos/logs/gofile_content.json"

          SUCCESS=0

          CURRENT_WINDOW=$(
            date +%s
          )

          CURRENT_WINDOW=$(
            CURRENT_WINDOW=$CURRENT_WINDOW
            echo $((CURRENT_WINDOW / 14400))
          )

          # Current window and previous window.
          for WINDOW in \
            "$CURRENT_WINDOW" \
            "$((CURRENT_WINDOW - 1))"
          do

            echo
            echo "Trying WT time window: $WINDOW"

            WT="$(
              python3 - "$WINDOW" <<'PY'
          import hashlib
          import os
          import sys

          window = sys.argv[1]

          ua = os.environ["GOFILE_USER_AGENT"]
          language = os.environ["GOFILE_LANGUAGE"]
          account = os.environ["GOFILE_TOKEN"]
          secret = os.environ["GOFILE_WT_SECRET"]

          raw = (
              f"{ua}::"
              f"{language}::"
              f"{account}::"
              f"{window}::"
              f"{secret}"
          )

          print(
              hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()
          )
          PY
            )"

            echo "::add-mask::$WT"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "$RESPONSE" \
                --write-out "%{http_code}" \
                --connect-timeout 30 \
                --max-time 90 \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/json" \
                -H "Accept-Encoding: gzip" \
                -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                -H "X-Website-Token: ${WT}" \
                -H "X-BL: ${GOFILE_LANGUAGE}" \
                -H "Origin: https://gofile.io" \
                -H "Referer: https://gofile.io/" \
                -G \
                --data-urlencode "contentFilter=" \
                --data-urlencode "page=1" \
                --data-urlencode "pageSize=1000" \
                --data-urlencode "sortField=name" \
                --data-urlencode "sortDirection=1" \
                "https://api.gofile.io/contents/${GOFILE_ID}" \
                || true
            )"

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]]; then

              STATUS="$(
                jq -r '.status // empty' "$RESPONSE" 2>/dev/null || true
              )"

              if [[ "$STATUS" == "ok" ]]; then

                SUCCESS=1

                echo
                echo "============================================================"
                echo "              GOFILE CONTENT FOUND"
                echo "============================================================"

                break
              fi

            elif [[ "$HTTP_CODE" == "429" ]]; then

              echo
              echo "============================================================"
              echo "                 GOFILE RATE LIMITED"
              echo "============================================================"

              echo
              echo "Gofile returned HTTP 429."
              echo
              echo "The workflow will STOP instead of repeatedly retrying."
              echo "Wait a few minutes and run the workflow again."

              exit 20

            else

              echo
              echo "Gofile response:"

              jq . "$RESPONSE" 2>/dev/null ||
                cat "$RESPONSE"

            fi

          done

          if [[ "$SUCCESS" -ne 1 ]]; then

            echo
            echo "============================================================"
            echo "             GOFILE CONTENT REQUEST FAILED"
            echo "============================================================"

            jq . "$RESPONSE" 2>/dev/null ||
              cat "$RESPONSE"

            exit 1
          fi

          echo
          echo "Gofile content resolved."

          jq . "$RESPONSE"

      # ==========================================================
      # 9. EXTRACT FILE INFORMATION
      # ==========================================================

      - name: Extract file information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "               EXTRACT FILE INFORMATION"
          echo "============================================================"

          JSON="$RUNNER_TEMP/mistos/logs/gofile_content.json"

          python3 - "$JSON" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              response = json.load(f)

          if response.get("status") != "ok":
              print(
                  "ERROR: Gofile response status is not ok."
              )
              sys.exit(1)

          data = response.get("data", {})

          files = []

          if data.get("type") == "file":
              files.append(data)

          children = data.get("children")

          if isinstance(children, dict):

              for child in children.values():

                  if child.get("type") == "file":
                      files.append(child)

          elif isinstance(children, list):

              for child in children:

                  if child.get("type") == "file":
                      files.append(child)

          if not files:

              print(
                  "ERROR: No downloadable files found."
              )

              sys.exit(1)

          if len(files) > 1:

              print(
                  f"ERROR: Gofile contains {len(files)} files."
              )

              print(
                  "This workflow expects exactly one file."
              )

              print()

              for item in files:
                  print(
                      item.get("name", "<unknown>")
                  )

              sys.exit(1)

          item = files[0]

          file_id = item.get("id", "")
          name = item.get("name", "")
          size = item.get("size", 0)
          link = item.get("link", "")

          if not name:

              print(
                  "ERROR: Filename missing."
              )

              sys.exit(1)

          if not link:

              print(
                  "ERROR: Direct download link missing."
              )

              sys.exit(1)

          print(
              f"Filename : {name}"
          )

          print(
              f"File ID  : {file_id}"
          )

          print(
              f"Size     : {size}"
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as env:

              env.write(
                  f"GOFILE_FILE_ID={file_id}\n"
              )

              env.write(
                  f"GOFILE_FILENAME={name}\n"
              )

              env.write(
                  f"GOFILE_EXPECTED_SIZE={size}\n"
              )

              env.write(
                  f"GOFILE_DIRECT_LINK={link}\n"
              )
          PY

      # ==========================================================
      # 10. DOWNLOAD FILE
      # ==========================================================

      - name: Download Gofile file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          OUTPUT="$RUNNER_TEMP/mistos/download/$GOFILE_FILENAME"

          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_EXPECTED_SIZE bytes"

          echo
          echo "Downloading..."

          curl \
            --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 0 \
            -A "$GOFILE_USER_AGENT" \
            -H "Cookie: accountToken=${GOFILE_TOKEN}" \
            -C - \
            --progress-bar \
            -o "$OUTPUT" \
            "$GOFILE_DIRECT_LINK"

          echo
          echo "Download completed."

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          SIZE="$(
            stat -c '%s' "$OUTPUT"
          )"

          TYPE="$(
            file -b "$OUTPUT"
          )"

          SHA256="$(
            sha256sum "$OUTPUT" |
              awk '{print $1}'
          )"

          echo
          echo "Downloaded file:"
          echo "$OUTPUT"

          echo
          echo "Actual size:"
          echo "$SIZE bytes"

          echo
          echo "File type:"
          echo "$TYPE"

          echo
          echo "SHA256:"
          echo "$SHA256"

          if [[ "$SIZE" -lt 10000 ]]; then

            echo
            echo "::error::Downloaded file is suspiciously small."

            echo
            echo "First 1000 bytes:"

            head -c 1000 "$OUTPUT" || true

            exit 1
          fi

          if echo "$TYPE" |
            grep -qiE \
              'HTML document|XML document|ASCII text|Unicode text|JSON'; then

            echo
            echo "::error::Downloaded response appears to be HTML/text/JSON."

            echo
            echo "First 1000 bytes:"

            head -c 1000 "$OUTPUT" || true

            exit 1
          fi

          if [[ "$GOFILE_EXPECTED_SIZE" =~ ^[0-9]+$ ]] &&
             [[ "$GOFILE_EXPECTED_SIZE" -gt 0 ]]; then

            if [[ "$SIZE" -ne "$GOFILE_EXPECTED_SIZE" ]]; then

              echo
              echo "::error::Downloaded size does not match Gofile metadata."

              echo "Expected: $GOFILE_EXPECTED_SIZE"
              echo "Actual  : $SIZE"

              exit 1
            fi

            echo
            echo "Size verification: PASSED."
          fi

          echo "DOWNLOADED_FILE=$OUTPUT" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SHA256=$SHA256" >> "$GITHUB_ENV"

      # ==========================================================
      # 11. SOURCEFORGE CREDENTIAL CHECK
      # ==========================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CREDENTIAL CHECK"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "::error::SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "::error::SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "Username: $SOURCEFORGE_USER"
          echo "Password: ********"
          echo
          echo "Credentials found."

      # ==========================================================
      # 12. TEST SOURCEFORGE
      # ==========================================================

      - name: Test SourceForge connection
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CONNECTION TEST"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_test.txt"

          cat > "$SCRIPT" <<EOF
          pwd
          ls
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge connection successful."

      # ==========================================================
      # 13. CHECK / CREATE DEVICE DIRECTORY
      # ==========================================================

      - name: Check or create SourceForge device directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE DEVICE DIRECTORY"
          echo "============================================================"

          BASE="/home/frs/project-mistos/Android17"

          DEVICE_DIR="${BASE}/${DEVICE}"

          echo "Base:"
          echo "$BASE"

          echo
          echo "Device:"
          echo "$DEVICE"

          echo
          echo "Destination:"
          echo "$DEVICE_DIR"

          CHECK="$RUNNER_TEMP/sourceforge_check_device.txt"

          cat > "$CHECK" <<EOF
          cd ${BASE}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$CHECK" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net" \
            > "$RUNNER_TEMP/mistos/logs/device_check.log" 2>&1

          STATUS=$?

          set -e

          if [[ "$STATUS" -eq 0 ]]; then

            echo
            echo "Device directory already exists."
            echo "Using existing directory."

          else

            echo
            echo "Device directory does not exist."
            echo "Creating directory..."

            CREATE="$RUNNER_TEMP/sourceforge_create_device.txt"

            cat > "$CREATE" <<EOF
          cd ${BASE}
          mkdir ${DEVICE}
          bye
          EOF

            chmod 600 "$CREATE"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -b "$CREATE" \
              "${SOURCEFORGE_USER}@frs.sourceforge.net"

            echo
            echo "Device directory created."
          fi

          echo "SOURCEFORGE_DEVICE_DIR=$DEVICE_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 14. UPLOAD TO SOURCEFORGE
      # ==========================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "$DOWNLOADED_SHA256"

          echo
          echo "Destination:"
          echo "$SOURCEFORGE_DEVICE_DIR"

          SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${GOFILE_FILENAME}"
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          echo
          echo "Starting SourceForge upload..."
          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge upload completed."

      # ==========================================================
      # 15. VERIFY SOURCEFORGE UPLOAD
      # ==========================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_verify.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "============================================================"
          echo "                  UPLOAD VERIFIED"
          echo "============================================================"

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/"

          echo
          echo "SourceForge file:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/${GOFILE_FILENAME}"

      # ==========================================================
      # 16. CLEANUP - ALWAYS
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          echo "Removing downloaded files..."

          rm -rf \
            "$RUNNER_TEMP/mistos"

          echo "Removing temporary SourceForge scripts..."

          rm -f \
            "$RUNNER_TEMP/sourceforge_test.txt" \
            "$RUNNER_TEMP/sourceforge_check_device.txt" \
            "$RUNNER_TEMP/sourceforge_create_device.txt" \
            "$RUNNER_TEMP/sourceforge_upload.txt" \
            "$RUNNER_TEMP/sourceforge_verify.txt"

          echo
          echo "Cleanup completed."

      # ==========================================================
      # 17. FINAL SUMMARY
      # ==========================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo
          echo "Device:"
          echo "${{ inputs.device }}"

          if [[ -n "${GOFILE_FILENAME:-}" ]]; then
            echo
            echo "File:"
            echo "$GOFILE_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo
            echo "Size:"
            echo "$DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo
            echo "SHA256:"
            echo "$DOWNLOADED_SHA256"
          fi

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/"

          if [[ -n "${GOFILE_FILENAME:-}" ]]; then
            echo
            echo "SourceForge file:"
            echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/${GOFILE_FILENAME}"
          fi

          echo
          echo "============================================================"
          echo "                       FINISHED"
          echo "============================================================"
