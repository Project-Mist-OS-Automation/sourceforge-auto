name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile URL (example: https://gofile.io/d/OXHOeYwi)"
        required: true
        type: string

      device:
        description: "Device name (raphael, bluejay, lisa, sweet, raven, etc.)"
        required: true
        type: string

jobs:
  transfer:
    name: Gofile → SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

      GOFILE_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ==========================================================
      # 1. Install dependencies
      # ==========================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              MISTOS GOFILE → SOURCEFORGE"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            file \
            sshpass \
            openssh-client \
            ca-certificates \
            python3 \
            nodejs

          mkdir -p "$RUNNER_TEMP/mistos-transfer/download"
          mkdir -p "$RUNNER_TEMP/mistos-transfer/logs"

          echo
          echo "Dependencies installed."

      # ==========================================================
      # 2. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          if [[ "$DEVICE" == "." || "$DEVICE" == ".." ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ "$DEVICE" == *"/"* || "$DEVICE" == *"\\"* ]]; then
            echo "::error::Device name cannot contain / or \\."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"

      # ==========================================================
      # 3. Extract Gofile ID
      # ==========================================================

      - name: Extract Gofile ID
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  GOFILE ID EXTRACTION"
          echo "============================================================"

          CLEAN_URL="${GOFILE_URL%%\?*}"
          CLEAN_URL="${CLEAN_URL%/}"

          if [[ "$CLEAN_URL" =~ /d/([^/]+)$ ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Gofile ID."
            echo
            echo "Expected:"
            echo "https://gofile.io/d/XXXXXXXX"
            exit 1
          fi

          echo "Gofile ID: $GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. Download CURRENT Gofile WT JavaScript
      # ==========================================================

      - name: Get current Gofile website-token script
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "          GET CURRENT GOFILE WEBSITE TOKEN SCRIPT"
          echo "============================================================"

          SCRIPT_FILE="$RUNNER_TEMP/mistos-transfer/gofile_wt.js"

          WEBSITE_HTML="$RUNNER_TEMP/mistos-transfer/gofile.html"

          echo "Downloading Gofile homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 30 \
            --max-time 60 \
            -A "$GOFILE_USER_AGENT" \
            -H "Accept: text/html,application/xhtml+xml" \
            "https://gofile.io/" \
            -o "$WEBSITE_HTML"

          echo "Searching homepage for WT script..."

          DISCOVERED_URL="$(
            python3 - "$WEBSITE_HTML" <<'PY'
          import re
          import sys
          from urllib.parse import urljoin

          html = open(sys.argv[1], encoding="utf-8", errors="ignore").read()

          patterns = [
              r'<script[^>]+src=["\']([^"\']*wt[^"\']*\.js)["\']',
              r'<script[^>]+src=["\']([^"\']*wt\.obf\.js)["\']',
          ]

          for pattern in patterns:
              m = re.search(pattern, html, re.I)

              if m:
                  print(urljoin("https://gofile.io/", m.group(1)))
                  break
          PY
          )"

          echo "Discovered URL:"
          echo "${DISCOVERED_URL:-<none>}"

          URLS=()

          if [[ -n "$DISCOVERED_URL" ]]; then
            URLS+=("$DISCOVERED_URL")
          fi

          URLS+=(
            "https://gofile.io/js/wt.obf.js"
            "https://gofile.io/dist/js/wt.obf.js"
          )

          FOUND=0

          for URL in "${URLS[@]}"; do

            echo
            echo "Trying:"
            echo "$URL"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 60 \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/javascript,text/javascript,*/*;q=0.8" \
              -H "Referer: https://gofile.io/" \
              "$URL" \
              -o "$SCRIPT_FILE"; then

              if [[ -s "$SCRIPT_FILE" ]]; then

                FIRST_CHAR="$(
                  sed 's/^[[:space:]]*//' "$SCRIPT_FILE" |
                  head -c 1
                )"

                if [[ "$FIRST_CHAR" != "<" ]]; then

                  echo
                  echo "Successfully downloaded WT script."
                  echo "Source:"
                  echo "$URL"

                  FOUND=1
                  break

                fi
              fi
            fi

            echo "Failed."
          done

          if [[ "$FOUND" -ne 1 ]]; then
            echo
            echo "::error::Could not download Gofile WT script."
            exit 1
          fi

          echo
          echo "WT script size:"
          wc -c "$SCRIPT_FILE"

          echo "GOFILE_WT_SCRIPT=$SCRIPT_FILE" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. Extract WT secret by executing generateWT()
      # ==========================================================

      - name: Extract Gofile WT secret
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             EXTRACT GOFILE WT SECRET"
          echo "============================================================"

          SCRIPT="$GOFILE_WT_SCRIPT"

          cat > "$RUNNER_TEMP/mistos-transfer/extract_wt.js" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const crypto = require("crypto");

          const scriptFile = process.argv[2];

          const script = fs.readFileSync(
            scriptFile,
            "utf8"
          );

          let rawHashInput = null;

          const probeUserAgent = "MistOSGofileUserAgent";
          const probeLanguage = "en-US";
          const probeToken = "MistOSGofileToken";

          const context = vm.createContext({
            console: {
              log() {},
              warn() {},
              error() {}
            },

            crypto: {
              subtle: {
                digest: async function(algorithm, data) {
                  const hash = crypto.createHash("sha256");
                  hash.update(Buffer.from(data));
                  return hash.digest().buffer;
                }
              }
            },

            Date,
            Math,
            URLSearchParams,

            navigator: {
              userAgent: probeUserAgent,
              language: probeLanguage
            },

            window: {
              crypto: {
                subtle: {
                  digest: async function(algorithm, data) {
                    const hash = crypto.createHash("sha256");
                    hash.update(Buffer.from(data));
                    return hash.digest().buffer;
                  }
                }
              },

              location: {
                hostname: "gofile.io",
                search: ""
              },

              navigator: {
                userAgent: probeUserAgent,
                language: probeLanguage
              }
            },

            appdata: {}
          });

          // Intercept hashing.
          //
          // Gofile's generator ultimately hashes:
          //
          // userAgent::language::accountToken::timeWindow::secret

          context._sha256 = function(input) {
            rawHashInput = String(input);

            return "0".repeat(64);
          };

          try {
            vm.runInContext(
              script,
              context,
              {
                timeout: 3000
              }
            );
          } catch (e) {
            // Some browser-specific code may throw during startup.
            // generateWT can still be available.
          }

          if (typeof context.generateWT !== "function") {
            console.error(
              "ERROR: generateWT() was not found."
            );

            process.exit(2);
          }

          try {
            vm.runInContext(
              `generateWT(${JSON.stringify(probeToken)})`,
              context,
              {
                timeout: 3000
              }
            );
          } catch (e) {
            console.error(
              "ERROR: generateWT() execution failed:"
            );

            console.error(e.message);

            process.exit(3);
          }

          if (!rawHashInput) {
            console.error(
              "ERROR: WT generator did not expose hash input."
            );

            process.exit(4);
          }

          const prefix =
            `${probeUserAgent}::${probeLanguage}::${probeToken}::`;

          if (!rawHashInput.startsWith(prefix)) {
            console.error(
              "ERROR: Unsupported WT generator format."
            );

            console.error(
              "Hash input prefix did not match."
            );

            process.exit(5);
          }

          const remainder =
            rawHashInput.slice(prefix.length);

          const parts =
            remainder.split("::");

          if (parts.length < 2) {
            console.error(
              "ERROR: Could not extract WT secret."
            );

            process.exit(6);
          }

          // First part is time window.
          // Everything after that is the secret.
          const secret =
            parts.slice(1).join("::").trim();

          if (!secret) {
            console.error(
              "ERROR: Empty WT secret."
            );

            process.exit(7);
          }

          console.log(secret);
          NODE

          SECRET="$(
            node \
              "$RUNNER_TEMP/mistos-transfer/extract_wt.js" \
              "$SCRIPT"
          )"

          if [[ -z "$SECRET" ]]; then
            echo "::error::Could not extract Gofile WT secret."
            exit 1
          fi

          echo "Gofile WT secret successfully extracted."

          # Secret itself is NOT printed.
          echo "::add-mask::$SECRET"

          echo "GOFILE_WT_SECRET=$SECRET" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. Create guest account
      # ==========================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              CREATE GOFILE GUEST ACCOUNT"
          echo "============================================================"

          python3 <<'PY'
          import hashlib
          import os
          import time
          import requests

          UA = os.environ["GOFILE_USER_AGENT"]
          LANG = os.environ["GOFILE_LANGUAGE"]
          SECRET = os.environ["GOFILE_WT_SECRET"]

          window = int(time.time()) // 14400

          raw = (
              f"{UA}::"
              f"{LANG}::"
              f"::{window}::"
              f"{SECRET}"
          )

          wt = hashlib.sha256(
              raw.encode()
          ).hexdigest()

          headers = {
              "User-Agent": UA,
              "Accept": "application/json",
              "X-Website-Token": wt,
              "X-BL": LANG,
              "Origin": "https://gofile.io",
              "Referer": "https://gofile.io/"
          }

          response = requests.post(
              "https://api.gofile.io/accounts",
              headers=headers,
              timeout=60
          )

          print(
              f"Gofile account HTTP status: {response.status_code}"
          )

          try:
              data = response.json()
          except Exception:
              print(response.text[:1000])
              raise SystemExit(
                  "Gofile returned non-JSON response."
              )

          if data.get("status") != "ok":
              print(data)
              raise SystemExit(
                  "Failed to create Gofile guest account."
              )

          token = data.get("data", {}).get("token")

          if not token:
              raise SystemExit(
                  "Gofile did not return an account token."
              )

          print("Gofile guest account created.")

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as f:
              f.write(
                  f"GOFILE_TOKEN={token}\n"
              )
          PY

      # ==========================================================
      # 7. Get Gofile content
      # ==========================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GET GOFILE CONTENT"
          echo "============================================================"

          RESPONSE="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          SUCCESS=0

          # Only a few attempts.
          #
          # Do NOT hammer Gofile after 429.
          for attempt in 1 2 3; do

            echo
            echo "Attempt $attempt/3"

            python3 <<'PY' > "$RUNNER_TEMP/mistos-transfer/request.py"
          import hashlib
          import os
          import time

          UA = os.environ["GOFILE_USER_AGENT"]
          LANG = os.environ["GOFILE_LANGUAGE"]
          TOKEN = os.environ["GOFILE_TOKEN"]
          SECRET = os.environ["GOFILE_WT_SECRET"]

          # Current and previous time windows.
          current = int(time.time()) // 14400

          for window in [current, current - 1]:

              raw = (
                  f"{UA}::"
                  f"{LANG}::"
                  f"{TOKEN}::"
                  f"{window}::"
                  f"{SECRET}"
              )

              wt = hashlib.sha256(
                  raw.encode()
              ).hexdigest()

              print(
                  window,
                  wt
              )
          PY

            mapfile -t TOKENS < <(
              python3 "$RUNNER_TEMP/mistos-transfer/request.py"
            )

            RESPONSE_CODE=0

            for entry in "${TOKENS[@]}"; do

              WINDOW="${entry%% *}"
              WT="${entry#* }"

              echo "Trying time window: $WINDOW"

              HTTP_CODE="$(
                curl \
                  --silent \
                  --show-error \
                  --output "$RESPONSE" \
                  --write-out "%{http_code}" \
                  --connect-timeout 30 \
                  --max-time 90 \
                  -A "$GOFILE_USER_AGENT" \
                  -H "Accept: application/json" \
                  -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                  -H "X-Website-Token: ${WT}" \
                  -H "X-BL: ${GOFILE_LANGUAGE}" \
                  -H "Origin: https://gofile.io" \
                  -H "Referer: https://gofile.io/" \
                  -G \
                  --data-urlencode "contentFilter=" \
                  --data-urlencode "page=1" \
                  --data-urlencode "pageSize=1000" \
                  --data-urlencode "sortField=name" \
                  --data-urlencode "sortDirection=1" \
                  "https://api.gofile.io/contents/${GOFILE_ID}" \
                  || true
              )"

              echo "HTTP status: $HTTP_CODE"

              if [[ "$HTTP_CODE" == "200" ]]; then

                STATUS="$(
                  jq -r '.status // empty' "$RESPONSE" 2>/dev/null || true
                )"

                if [[ "$STATUS" == "ok" ]]; then
                  SUCCESS=1
                  break 2
                fi

              elif [[ "$HTTP_CODE" == "401" ]]; then

                echo "Website token rejected."

              elif [[ "$HTTP_CODE" == "429" ]]; then

                echo
                echo "Gofile rate limit reached."
                echo
                echo "Stopping immediately to avoid making the rate limit worse."
                echo
                echo "Wait several minutes before rerunning the workflow."

                exit 20

              fi

            done

            if [[ "$SUCCESS" -eq 1 ]]; then
              break
            fi

            if [[ "$attempt" -lt 3 ]]; then
              WAIT=$((attempt * 30))

              echo
              echo "Waiting ${WAIT} seconds..."
              sleep "$WAIT"
            fi

          done

          if [[ "$SUCCESS" -ne 1 ]]; then

            echo
            echo "============================================================"
            echo "                 GOFILE REQUEST FAILED"
            echo "============================================================"

            jq . "$RESPONSE" 2>/dev/null ||
              cat "$RESPONSE"

            exit 1
          fi

          echo
          echo "Gofile content successfully resolved."

          jq . "$RESPONSE"

      # ==========================================================
      # 8. Extract file information
      # ==========================================================

      - name: Extract file information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "               EXTRACT FILE INFORMATION"
          echo "============================================================"

          JSON="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          python3 <<'PY'
          import json
          import os
          import sys

          path = os.environ["RUNNER_TEMP"] + \
                 "/mistos-transfer/logs/gofile_content.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          root = data.get("data", {})

          files = []

          if root.get("type") == "file":
              files.append(root)

          children = root.get("children", {})

          if isinstance(children, dict):
              for item in children.values():
                  if item.get("type") == "file":
                      files.append(item)

          elif isinstance(children, list):
              for item in children:
                  if item.get("type") == "file":
                      files.append(item)

          if not files:
              print("ERROR: No downloadable file found.")
              sys.exit(1)

          if len(files) > 1:
              print(
                  f"ERROR: Gofile contains {len(files)} files."
              )
              print(
                  "This workflow expects one ROM file."
              )
              print(
                  "Files:"
              )

              for item in files:
                  print(
                      item.get("name", "<unknown>")
                  )

              sys.exit(1)

          item = files[0]

          file_id = item.get("id", "")
          name = item.get("name", "")
          size = item.get("size", 0)
          link = (
              item.get("link")
              or item.get("directLink")
              or ""
          )

          if not name:
              print("ERROR: Filename missing.")
              sys.exit(1)

          if not link:
              print("ERROR: Download URL missing.")
              sys.exit(1)

          print(f"Filename: {name}")
          print(f"Size: {size}")
          print(f"File ID: {file_id}")

          env = os.environ["GITHUB_ENV"]

          with open(env, "a") as f:
              f.write(
                  f"GOFILE_FILE_ID={file_id}\n"
              )
              f.write(
                  f"GOFILE_FILENAME={name}\n"
              )
              f.write(
                  f"GOFILE_EXPECTED_SIZE={size}\n"
              )
              f.write(
                  f"GOFILE_DIRECT_LINK={link}\n"
              )
          PY

      # ==========================================================
      # 9. Download actual file
      # ==========================================================

      - name: Download Gofile file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          DOWNLOAD_DIR="$RUNNER_TEMP/mistos-transfer/download"

          mkdir -p "$DOWNLOAD_DIR"

          OUTPUT="$DOWNLOAD_DIR/$GOFILE_FILENAME"

          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_EXPECTED_SIZE bytes"

          echo
          echo "Starting download..."
          echo

          curl \
            --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 0 \
            -A "$GOFILE_USER_AGENT" \
            -H "Cookie: accountToken=${GOFILE_TOKEN}" \
            -C - \
            --progress-bar \
            -o "$OUTPUT" \
            "$GOFILE_DIRECT_LINK"

          echo
          echo "Download completed."

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          echo
          ls -lh "$OUTPUT"

          echo "DOWNLOADED_FILE=$OUTPUT" >> "$GITHUB_ENV"

      # ==========================================================
      # 10. Validate download
      # ==========================================================

      - name: Validate downloaded file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  DOWNLOAD VALIDATION"
          echo "============================================================"

          FILE="$DOWNLOADED_FILE"

          SIZE="$(stat -c '%s' "$FILE")"
          TYPE="$(file -b "$FILE")"
          SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "Filename : $GOFILE_FILENAME"
          echo "Size     : $SIZE bytes"
          echo "Type     : $TYPE"
          echo "SHA256   : $SHA256"

          if [[ "$SIZE" -lt 10000 ]]; then
            echo
            echo "::error::Downloaded file is suspiciously small."

            echo
            echo "Response:"
            head -c 1000 "$FILE" || true

            exit 1
          fi

          if echo "$TYPE" |
            grep -qiE \
              'HTML document|XML document|ASCII text|Unicode text|JSON'; then

            echo
            echo "::error::Downloaded file appears to be HTML/text/JSON."

            echo
            echo "First bytes:"
            head -c 1000 "$FILE" || true

            exit 1
          fi

          if [[ "$GOFILE_EXPECTED_SIZE" =~ ^[0-9]+$ ]] &&
             [[ "$GOFILE_EXPECTED_SIZE" -gt 0 ]]; then

            if [[ "$SIZE" -ne "$GOFILE_EXPECTED_SIZE" ]]; then

              echo
              echo "::error::File size mismatch."

              echo "Expected: $GOFILE_EXPECTED_SIZE"
              echo "Actual  : $SIZE"

              exit 1
            fi
          fi

          echo
          echo "Download validation PASSED."

          {
            echo "DOWNLOADED_SIZE=$SIZE"
            echo "DOWNLOADED_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # 11. Test SourceForge
      # ==========================================================

      - name: Test SourceForge connection
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CONNECTION TEST"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_test.txt"

          cat > "$SCRIPT" <<EOF
          pwd
          ls
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge connection successful."

      # ==========================================================
      # 12. Check/create device directory
      # ==========================================================

      - name: Check or create SourceForge device directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "            SOURCEFORGE DEVICE DIRECTORY"
          echo "============================================================"

          BASE="/home/frs/project-mistos/Android17"
          DEVICE_DIR="${BASE}/${DEVICE}"

          CHECK="$RUNNER_TEMP/sourceforge_check.txt"

          cat > "$CHECK" <<EOF
          cd ${BASE}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$CHECK" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net" \
            > "$RUNNER_TEMP/mistos-transfer/logs/device_check.log" 2>&1

          STATUS=$?

          set -e

          if [[ "$STATUS" -eq 0 ]]; then

            echo "Device directory already exists."
            echo "Using:"
            echo "$DEVICE_DIR"

          else

            echo "Device directory does not exist."
            echo "Creating:"
            echo "$DEVICE_DIR"

            CREATE="$RUNNER_TEMP/sourceforge_create.txt"

            cat > "$CREATE" <<EOF
          cd ${BASE}
          mkdir ${DEVICE}
          bye
          EOF

            chmod 600 "$CREATE"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -b "$CREATE" \
              "${SOURCEFORGE_USER}@frs.sourceforge.net"

            echo "Device directory created."

          fi

          echo "SOURCEFORGE_DEVICE_DIR=$DEVICE_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 13. Upload
      # ==========================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          echo "File:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "$DOWNLOADED_SHA256"

          echo
          echo "Destination:"
          echo "$SOURCEFORGE_DEVICE_DIR"

          SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${GOFILE_FILENAME}"
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          echo
          echo "Uploading..."

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Upload completed."

      # ==========================================================
      # 14. Verify upload
      # ==========================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_verify.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          ls -l "${GOFILE_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Remote file verified."

          echo
          echo "SourceForge URL:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/${GOFILE_FILENAME}"

      # ==========================================================
      # 15. Cleanup ALWAYS
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          rm -rf \
            "$RUNNER_TEMP/mistos-transfer/download"

          rm -rf \
            "$RUNNER_TEMP/mistos-transfer"

          rm -f \
            "$RUNNER_TEMP/sourceforge_test.txt" \
            "$RUNNER_TEMP/sourceforge_check.txt" \
            "$RUNNER_TEMP/sourceforge_create.txt" \
            "$RUNNER_TEMP/sourceforge_upload.txt" \
            "$RUNNER_TEMP/sourceforge_verify.txt"

          echo "Local downloaded files removed."
          echo "Cleanup complete."

      # ==========================================================
      # 16. Final summary
      # ==========================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device : ${{ inputs.device }}"

          if [[ -n "${GOFILE_FILENAME:-}" ]]; then
            echo "File   : $GOFILE_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size   : $DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256 : $DOWNLOADED_SHA256"
          fi

          echo
          echo "Directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/"

          if [[ -n "${GOFILE_FILENAME:-}" ]]; then
            echo
            echo "File:"
            echo "https://sourceforge.net/projects/project-mistos/files/Android17/${{ inputs.device }}/${GOFILE_FILENAME}"
          fi

          echo
          echo "============================================================"
