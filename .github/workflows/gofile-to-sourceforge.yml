name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (raphael, bluejay, lisa, sweet, raven, etc.)"
        required: true
        type: string

jobs:
  transfer:
    name: Gofile → SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

      GOFILE_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ==========================================================
      # 1. Prepare environment
      # ==========================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              MistOS GOFILE → SOURCEFORGE"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            file \
            openssh-client \
            sshpass \
            ca-certificates \
            python3

          mkdir -p "$RUNNER_TEMP/mistos-transfer/download"
          mkdir -p "$RUNNER_TEMP/mistos-transfer/logs"

          echo
          echo "Environment ready."

      # ==========================================================
      # 2. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          if [[ "$DEVICE" == "." || "$DEVICE" == ".." ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ "$DEVICE" == *"/"* || "$DEVICE" == *"\\"* ]]; then
            echo "::error::Device name cannot contain / or \\."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name: $DEVICE"
            echo
            echo "Allowed examples:"
            echo "  raven"
            echo "  raphael"
            echo "  bluejay"
            echo "  lisa"
            echo "  sweet"
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"

          echo
          echo "SourceForge destination:"
          echo "Android17/$DEVICE/"

      # ==========================================================
      # 3. Check SourceForge credentials
      # ==========================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CREDENTIAL CHECK"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "::error::SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "::error::SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "SourceForge user: $SOURCEFORGE_USER"
          echo "SourceForge password: ********"
          echo
          echo "Credentials found."

      # ==========================================================
      # 4. Extract Gofile ID
      # ==========================================================

      - name: Extract Gofile ID
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  GOFILE ID EXTRACTION"
          echo "============================================================"

          CLEAN_URL="${GOFILE_URL%%\?*}"
          CLEAN_URL="${CLEAN_URL%/}"

          if [[ "$CLEAN_URL" =~ /d/([^/]+)$ ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Gofile share ID."
            echo
            echo "Expected format:"
            echo "https://gofile.io/d/XXXXXXXX"
            exit 1
          fi

          if [[ -z "$GOFILE_ID" ]]; then
            echo "::error::Gofile ID is empty."
            exit 1
          fi

          echo "Gofile ID:"
          echo "$GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. Create Gofile guest account
      # ==========================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              GOFILE GUEST ACCOUNT"
          echo "============================================================"

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              -H "User-Agent: ${GOFILE_USER_AGENT}" \
              -H "Accept: application/json" \
              "https://api.gofile.io/accounts"
          )"

          echo "Gofile account response received."

          TOKEN="$(
            echo "$RESPONSE" |
              jq -r '.data.token // empty'
          )"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::Failed to obtain Gofile guest token."

            echo
            echo "Response:"
            echo "$RESPONSE" | jq . 2>/dev/null || true

            exit 1
          fi

          echo "Gofile guest token obtained."

          echo "GOFILE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. Generate current Gofile website token
      # ==========================================================

      - name: Generate Gofile website token
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             GENERATING GOFILE WEBSITE TOKEN"
          echo "============================================================"

          python3 <<'PY'
          import hashlib
          import os
          import time

          user_agent = os.environ["GOFILE_USER_AGENT"]
          language = os.environ["GOFILE_LANGUAGE"]
          account_token = os.environ["GOFILE_TOKEN"]

          # Current GoFile website-token algorithm.
          #
          # The website token changes in four-hour windows.
          # Keep the User-Agent and language identical to the
          # values used in the API request.

          window = int(time.time() / 14400)

          # Current salt used by the public GoFile web client.
          salt = "5d4f7g8sd45fsd"

          value = (
              f"{user_agent}::"
              f"{language}::"
              f"{account_token}::"
              f"{window}::"
              f"{salt}"
          )

          website_token = hashlib.sha256(
              value.encode()
          ).hexdigest()

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"GOFILE_WEBSITE_TOKEN={website_token}\n"
              )

          print("Gofile website token generated.")
          print(f"Time window: {window}")
          PY

      # ==========================================================
      # 7. Get Gofile content
      # ==========================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                 GET GOFILE CONTENT"
          echo "============================================================"

          API_URL="https://api.gofile.io/contents/${GOFILE_ID}"

          RESPONSE_FILE="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          echo "Requesting:"
          echo "$API_URL"

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "User-Agent: ${GOFILE_USER_AGENT}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${GOFILE_TOKEN}" \
            -H "X-Website-Token: ${GOFILE_WEBSITE_TOKEN}" \
            -H "X-BL: ${GOFILE_LANGUAGE}" \
            -G \
            --data-urlencode "contentFilter=" \
            --data-urlencode "page=1" \
            --data-urlencode "pageSize=1000" \
            --data-urlencode "sortField=name" \
            --data-urlencode "sortDirection=1" \
            "$API_URL" \
            > "$RESPONSE_FILE"

          echo "Gofile API response received."

          STATUS="$(
            jq -r '.status // empty' "$RESPONSE_FILE"
          )"

          if [[ "$STATUS" != "ok" ]]; then
            echo "::error::Gofile API returned status: $STATUS"

            echo
            echo "Gofile response:"
            jq . "$RESPONSE_FILE"

            exit 1
          fi

          echo
          echo "Gofile content successfully resolved."

          echo
          echo "Content information:"

          jq '{
            status,
            data: {
              id: .data.id,
              type: .data.type,
              name: .data.name,
              size: .data.size
            }
          }' "$RESPONSE_FILE" 2>/dev/null || true

      # ==========================================================
      # 8. Find actual file
      # ==========================================================

      - name: Find downloadable file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              FIND DOWNLOADABLE FILE"
          echo "============================================================"

          JSON="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          # For a direct file share, the root data object itself
          # contains the file link.
          FILE_INFO="$(
            jq -r '
              if (.data.type? == "file") then
                [
                  (.data.id // ""),
                  (.data.name // ""),
                  (.data.size // 0),
                  (.data.mimetype // ""),
                  (.data.link // "")
                ] | @tsv

              else
                [
                  .data.children[]? |
                  select(.type? == "file") |
                  [
                    (.id // ""),
                    (.name // ""),
                    (.size // 0),
                    (.mimetype // ""),
                    (.link // "")
                  ] | @tsv
                ] | .[]
              end
            ' "$JSON" |
            head -n 1
          )"

          if [[ -z "$FILE_INFO" ]]; then
            echo "::error::No downloadable file found."

            echo
            echo "Full Gofile response:"
            jq . "$JSON"

            exit 1
          fi

          IFS=$'\t' read -r \
            GOFILE_FILE_ID \
            GOFILE_FILENAME \
            GOFILE_EXPECTED_SIZE \
            GOFILE_MIMETYPE \
            GOFILE_DIRECT_LINK <<< "$FILE_INFO"

          if [[ -z "$GOFILE_FILENAME" ]]; then
            echo "::error::Gofile filename is empty."
            exit 1
          fi

          if [[ -z "$GOFILE_DIRECT_LINK" ]]; then
            echo "::error::Gofile did not provide a download link."
            exit 1
          fi

          echo "File ID       : $GOFILE_FILE_ID"
          echo "Filename      : $GOFILE_FILENAME"
          echo "Expected size : $GOFILE_EXPECTED_SIZE"
          echo "MIME type     : $GOFILE_MIMETYPE"

          echo
          echo "Direct download link obtained."

          {
            echo "GOFILE_FILE_ID=$GOFILE_FILE_ID"
            echo "GOFILE_FILENAME=$GOFILE_FILENAME"
            echo "GOFILE_EXPECTED_SIZE=$GOFILE_EXPECTED_SIZE"
            echo "GOFILE_MIMETYPE=$GOFILE_MIMETYPE"
            echo "GOFILE_DIRECT_LINK=$GOFILE_DIRECT_LINK"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # 9. Download actual file
      # ==========================================================

      - name: Download Gofile file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"

          OUTPUT_FILE="$DOWNLOAD_DIR/$GOFILE_FILENAME"

          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_EXPECTED_SIZE bytes"

          echo
          echo "Downloading..."
          echo

          wget \
            --continue \
            --show-progress \
            --progress=dot:giga \
            --timeout=60 \
            --tries=10 \
            --waitretry=10 \
            --retry-connrefused \
            --user-agent="$GOFILE_USER_AGENT" \
            -O "$OUTPUT_FILE" \
            "$GOFILE_DIRECT_LINK"

          echo
          echo "Download completed."

          if [[ ! -f "$OUTPUT_FILE" ]]; then
            echo "::error::Downloaded file does not exist."
            exit 1
          fi

          if [[ ! -s "$OUTPUT_FILE" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          ls -lh "$OUTPUT_FILE"

      # ==========================================================
      # 10. Validate download
      # ==========================================================

      - name: Validate downloaded file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  DOWNLOAD VALIDATION"
          echo "============================================================"

          FILE="$DOWNLOAD_DIR/$GOFILE_FILENAME"

          SIZE="$(stat -c '%s' "$FILE")"
          HUMAN_SIZE="$(du -h "$FILE" | cut -f1)"
          FILE_TYPE="$(file -b "$FILE")"
          SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "Filename : $GOFILE_FILENAME"
          echo "Size     : $SIZE bytes"
          echo "Size     : $HUMAN_SIZE"
          echo "Type     : $FILE_TYPE"
          echo "SHA256   : $SHA256"

          echo

          # 10 KB minimum sanity check.
          if [[ "$SIZE" -lt 10000 ]]; then
            echo "::error::Downloaded file is suspiciously small."
            echo
            echo "First 500 bytes:"
            head -c 500 "$FILE" || true
            echo
            exit 1
          fi

          # Detect obvious error pages.
          if echo "$FILE_TYPE" |
            grep -qiE \
              'HTML document|XML document|ASCII text|Unicode text|JSON'; then

            echo "::error::Downloaded response appears to be text/HTML/JSON."

            echo
            echo "First 500 bytes:"
            head -c 500 "$FILE" || true
            echo

            exit 1
          fi

          # Compare expected size when supplied by Gofile.
          if [[ "${GOFILE_EXPECTED_SIZE:-0}" =~ ^[0-9]+$ ]] &&
             [[ "$GOFILE_EXPECTED_SIZE" -gt 0 ]]; then

            if [[ "$SIZE" -ne "$GOFILE_EXPECTED_SIZE" ]]; then
              echo "::error::File size mismatch."

              echo "Expected: $GOFILE_EXPECTED_SIZE"
              echo "Actual  : $SIZE"

              exit 1
            fi

            echo "Gofile size check: PASSED"
          fi

          {
            echo "DOWNLOADED_FILE=$FILE"
            echo "DOWNLOADED_FILENAME=$GOFILE_FILENAME"
            echo "DOWNLOADED_SIZE=$SIZE"
            echo "DOWNLOADED_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "                 DOWNLOAD VERIFIED"
          echo "============================================================"

      # ==========================================================
      # 11. Test SourceForge connection
      # ==========================================================

      - name: Test SourceForge connection
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CONNECTION TEST"
          echo "============================================================"

          TEST_SCRIPT="$RUNNER_TEMP/sourceforge_test.txt"

          cat > "$TEST_SCRIPT" <<EOF
          pwd
          ls
          bye
          EOF

          chmod 600 "$TEST_SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$TEST_SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge SFTP connection successful."

      # ==========================================================
      # 12. Check Android17
      # ==========================================================

      - name: Check SourceForge Android17 directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             CHECK SOURCEFORGE ANDROID17"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_android17.txt"

          cat > "$SCRIPT" <<EOF
          cd /home/frs/project-mistos
          ls Android17
          bye
          EOF

          chmod 600 "$SCRIPT"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          STATUS=$?

          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo
            echo "::error::Android17 directory is not accessible."
            exit "$STATUS"
          fi

          echo
          echo "Android17 directory is accessible."

      # ==========================================================
      # 13. Check/create device directory
      # ==========================================================

      - name: Check or create device folder
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             CHECK DEVICE DIRECTORY"
          echo "============================================================"

          BASE_DIR="/home/frs/project-mistos/Android17"
          DEVICE_DIR="${BASE_DIR}/${DEVICE}"

          echo "Device:"
          echo "$DEVICE"

          echo
          echo "Destination:"
          echo "$DEVICE_DIR"

          CHECK_SCRIPT="$RUNNER_TEMP/sourceforge_check_device.txt"

          cat > "$CHECK_SCRIPT" <<EOF
          cd ${BASE_DIR}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK_SCRIPT"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$CHECK_SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net" \
            > "$RUNNER_TEMP/mistos-transfer/logs/device_check.log" 2>&1

          STATUS=$?

          set -e

          if [[ "$STATUS" -eq 0 ]]; then

            echo
            echo "============================================================"
            echo "             DEVICE FOLDER ALREADY EXISTS"
            echo "============================================================"

            echo "Using existing folder:"
            echo "$DEVICE_DIR"

          else

            echo
            echo "============================================================"
            echo "             DEVICE FOLDER NOT FOUND"
            echo "============================================================"

            echo "Creating:"
            echo "$DEVICE_DIR"

            CREATE_SCRIPT="$RUNNER_TEMP/sourceforge_create_device.txt"

            cat > "$CREATE_SCRIPT" <<EOF
          cd ${BASE_DIR}
          mkdir ${DEVICE}
          ls
          bye
          EOF

            chmod 600 "$CREATE_SCRIPT"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -b "$CREATE_SCRIPT" \
              "${SOURCEFORGE_USER}@frs.sourceforge.net"

            echo
            echo "Device folder created successfully."

          fi

          echo "SOURCEFORGE_DEVICE_DIR=$DEVICE_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 14. Upload
      # ==========================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          echo "File:"
          echo "$DOWNLOADED_FILENAME"

          echo
          echo "Size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "$DOWNLOADED_SHA256"

          echo
          echo "Destination:"
          echo "$SOURCEFORGE_DEVICE_DIR"

          UPLOAD_SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$UPLOAD_SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${DOWNLOADED_FILENAME}"
          ls -l "${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$UPLOAD_SCRIPT"

          echo
          echo "Starting upload..."
          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$UPLOAD_SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "============================================================"
          echo "                SOURCEFORGE UPLOAD DONE"
          echo "============================================================"

      # ==========================================================
      # 15. Verify upload
      # ==========================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          VERIFY_SCRIPT="$RUNNER_TEMP/sourceforge_verify.txt"

          cat > "$VERIFY_SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          ls -l "${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$VERIFY_SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$VERIFY_SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Remote file exists."

          echo
          echo "============================================================"
          echo "                  UPLOAD VERIFIED"
          echo "============================================================"

      # ==========================================================
      # 16. Cleanup - ALWAYS
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          echo "Removing downloaded files..."

          rm -rf "$DOWNLOAD_DIR"

          echo "Removing temporary files..."

          rm -f \
            "$RUNNER_TEMP/sourceforge_test.txt" \
            "$RUNNER_TEMP/sourceforge_android17.txt" \
            "$RUNNER_TEMP/sourceforge_check_device.txt" \
            "$RUNNER_TEMP/sourceforge_create_device.txt" \
            "$RUNNER_TEMP/sourceforge_upload.txt" \
            "$RUNNER_TEMP/sourceforge_verify.txt"

          echo
          echo "Checking cleanup..."

          if [[ -d "$DOWNLOAD_DIR" ]]; then
            echo "::warning::Download directory still exists."
          else
            echo "Download directory removed successfully."
          fi

          echo
          echo "Cleanup complete."

      # ==========================================================
      # 17. Final summary
      # ==========================================================

      - name: Final summary
        if: always()
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device : $DEVICE"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo "File   : $DOWNLOADED_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size   : $DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256 : $DOWNLOADED_SHA256"
          fi

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo
            echo "SourceForge file:"
            echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/${DOWNLOADED_FILENAME}"
          fi

          echo
          echo "============================================================"
          echo "                       FINISHED"
          echo "============================================================"
