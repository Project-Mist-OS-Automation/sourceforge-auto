name: Gofile to SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile share/download URL"
        required: true
        type: string

      device:
        description: "Device name (example: raphael, bluejay, lisa, sweet, raven)"
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCEFORGE_HOST: frs.sourceforge.net
  SOURCEFORGE_BASE: /home/frs/project/project-mistos/Android17

  GOFILE_USER_AGENT: "MistOS-Gofile-Uploader/1.0"
  GOFILE_LANGUAGE: "en-US"

jobs:
  upload:
    name: Download Gofile → Upload SourceForge
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            openssh-client \
            rsync \
            file \
            nodejs

          echo
          echo "Installed versions:"
          curl --version | head -n 1
          jq --version
          node --version
          rsync --version | head -n 1


      # ============================================================
      # PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mistos-gofile"

          echo "WORK_DIR=$RUNNER_TEMP/mistos-gofile" >> "$GITHUB_ENV"

          echo
          echo "Workspace:"
          echo "$RUNNER_TEMP/mistos-gofile"


      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL_INPUT: ${{ inputs.gofile_url }}
          DEVICE_INPUT: ${{ inputs.device }}
        run: |
          set -euo pipefail

          GOFILE_URL="$(echo "$GOFILE_URL_INPUT" | xargs)"
          DEVICE="$(echo "$DEVICE_INPUT" | xargs)"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "ERROR: Gofile URL is empty."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "ERROR: Device name is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "ERROR: Invalid Gofile URL."
            exit 1
          fi

          # Device directory must contain only safe characters.
          if [[ ! "$DEVICE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: Invalid device name."
            echo "Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1
          fi

          echo "GOFILE_URL=$GOFILE_URL" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "INPUT VALIDATION"
          echo "=============================================="
          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"


      # ============================================================
      # CLEANUP TRAP
      # ============================================================

      - name: Configure cleanup
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK_DIR/cleanup.sh" <<'EOF'
          #!/usr/bin/env bash
          set +e

          echo
          echo "=============================================="
          echo "CLEANUP"
          echo "=============================================="

          if [[ -n "${WORK_DIR:-}" && -d "$WORK_DIR" ]]; then
            echo "Removing downloaded files..."
            rm -rf "$WORK_DIR"
          fi

          if [[ -f "$HOME/.ssh/sourceforge_mistos" ]]; then
            rm -f "$HOME/.ssh/sourceforge_mistos"
          fi

          if [[ -f "$HOME/.ssh/sourceforge_mistos.pub" ]]; then
            rm -f "$HOME/.ssh/sourceforge_mistos.pub"
          fi

          if [[ -f "$HOME/.ssh/config" ]]; then
            rm -f "$HOME/.ssh/config"
          fi

          if [[ -f "$HOME/.ssh/known_hosts" ]]; then
            rm -f "$HOME/.ssh/known_hosts"
          fi

          echo "Cleanup completed."
          EOF

          chmod +x "$WORK_DIR/cleanup.sh"

          trap '"$WORK_DIR/cleanup.sh"' EXIT


      # ============================================================
      # EXTRACT GOFILE ID
      # ============================================================

      - name: Extract Gofile ID
        shell: bash
        run: |
          set -euo pipefail

          GOFILE_ID=""

          if [[ "$GOFILE_URL" =~ /d/([A-Za-z0-9]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          elif [[ "$GOFILE_URL" =~ /folder/([A-Za-z0-9]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          elif [[ "$GOFILE_URL" =~ /contents/([A-Za-z0-9]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$GOFILE_ID" ]]; then
            echo "ERROR: Could not extract Gofile content ID."
            echo "URL: $GOFILE_URL"
            exit 1
          fi

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "GOFILE ID"
          echo "=============================================="
          echo "ID: $GOFILE_ID"


      # ============================================================
      # DOWNLOAD GOFILE WEBSITE TOKEN SCRIPT
      # ============================================================

      - name: Download Gofile Website Token script
        shell: bash
        run: |
          set -euo pipefail

          WT_SCRIPT="$WORK_DIR/wt.js"

          echo
          echo "=============================================="
          echo "DOWNLOAD GOFILE WEBSITE TOKEN SCRIPT"
          echo "=============================================="

          STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --write-out "%{http_code}" \
            --output "$WT_SCRIPT" \
            --connect-timeout 30 \
            --max-time 60 \
            "https://gofile.io/js/wt.obf.js")"

          if [[ "$STATUS" != "200" || ! -s "$WT_SCRIPT" ]]; then
            echo "Primary WT script failed."

            echo "Trying fallback location..."

            STATUS="$(curl \
              --silent \
              --show-error \
              --location \
              --write-out "%{http_code}" \
              --output "$WT_SCRIPT" \
              --connect-timeout 30 \
              --max-time 60 \
              "https://gofile.io/dist/js/wt.obf.js")"
          fi

          if [[ "$STATUS" != "200" || ! -s "$WT_SCRIPT" ]]; then
            echo "ERROR: Could not download Gofile WT script."
            echo "HTTP status: $STATUS"
            exit 1
          fi

          echo "WT script downloaded successfully."
          echo "Size: $(stat -c '%s' "$WT_SCRIPT") bytes"


      # ============================================================
      # EXTRACT DYNAMIC GOFILE WT SECRET
      # ============================================================

      - name: Extract Gofile Website Token secret
        shell: bash
        run: |
          set -euo pipefail

          WT_SCRIPT="$WORK_DIR/wt.js"
          WT_SECRET_FILE="$WORK_DIR/wt-secret"

          node "$WORK_DIR/extract-wt.js" "$WT_SCRIPT" "$WT_SECRET_FILE"

          if [[ ! -s "$WT_SECRET_FILE" ]]; then
            echo "ERROR: WT secret extraction failed."
            exit 1
          fi

          WT_SECRET="$(cat "$WT_SECRET_FILE")"

          if [[ -z "$WT_SECRET" ]]; then
            echo "ERROR: WT secret is empty."
            exit 1
          fi

          echo "GOFILE_WT_SECRET=$WT_SECRET" >> "$GITHUB_ENV"

          echo
          echo "Gofile Website Token secret extracted successfully."


      # ============================================================
      # CREATE NODE WT EXTRACTION SCRIPT
      # ============================================================

      - name: Create WT extraction helper
        shell: bash
        run: |
          set -euo pipefail

          cat > "$WORK_DIR/extract-wt.js" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const crypto = require("crypto");

          const scriptFile = process.argv[2];
          const outputFile = process.argv[3];

          if (!scriptFile || !outputFile) {
            throw new Error("Usage: node extract-wt.js <script> <output>");
          }

          const script = fs.readFileSync(scriptFile, "utf8");

          let rawHashInput = "";

          const probeUserAgent = "MistOSGofileUserAgent";
          const probeLanguage = "MistOSGofileLanguage";
          const probeToken = "MistOSGofileToken";

          const navigator = {
            userAgent: probeUserAgent,
            language: probeLanguage
          };

          const context = vm.createContext(
            {
              appdata: {},

              crypto: crypto.webcrypto,

              console: {
                error() {},
                log() {},
                warn() {}
              },

              Date,
              Math,
              navigator,
              URLSearchParams,

              window: {
                crypto: crypto.webcrypto,

                location: {
                  hostname: "gofile.io",
                  search: ""
                },

                navigator
              }
            },
            {
              name: "gofile-website-token"
            }
          );

          vm.runInContext(
            script,
            context,
            {
              timeout: 5000
            }
          );

          if (typeof context.generateWT !== "function") {
            throw new Error("generateWT function was not found.");
          }

          /*
           * The Gofile website generates the Website Token by hashing
           * a string containing:
           *
           * userAgent::language::accountToken::timeWindow::secret
           *
           * We intercept the SHA256 input so the current secret can
           * be recovered without hardcoding an old Gofile secret.
           */
          context._sha256 = (input) => {
            rawHashInput = String(input);
            return "0".repeat(64);
          };

          vm.runInContext(
            `generateWT(${JSON.stringify(probeToken)})`,
            context,
            {
              timeout: 5000
            }
          );

          if (!rawHashInput) {
            throw new Error("Gofile WT hash input was not captured.");
          }

          const expectedPrefix =
            `${probeUserAgent}::${probeLanguage}::${probeToken}::`;

          if (!rawHashInput.startsWith(expectedPrefix)) {
            throw new Error(
              "Unexpected Gofile WT hash format:\n" + rawHashInput
            );
          }

          const remaining =
            rawHashInput.slice(expectedPrefix.length);

          const parts = remaining.split("::");

          if (parts.length < 2) {
            throw new Error(
              "Could not extract WT secret from hash input."
            );
          }

          /*
           * The last component is the dynamic secret.
           */
          const secret = parts[parts.length - 1].trim();

          if (!secret) {
            throw new Error("Extracted Gofile WT secret is empty.");
          }

          fs.writeFileSync(outputFile, secret + "\n");

          console.log("Gofile WT secret extracted.");
          NODE

          echo "WT helper created."


      # ============================================================
      # CREATE GOFILE GUEST ACCOUNT
      # ============================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "CREATE GOFILE GUEST ACCOUNT"
          echo "=============================================="

          TIME_WINDOW="$(( $(date +%s) / 14400 ))"

          echo "Time window: $TIME_WINDOW"

          INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::::${TIME_WINDOW}::${GOFILE_WT_SECRET}"

          WT="$(printf '%s' "$INPUT" | sha256sum | awk '{print $1}')"

          RESPONSE="$WORK_DIR/account.json"

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --compressed \
            --output "$RESPONSE" \
            --write-out "%{http_code}" \
            --connect-timeout 30 \
            --max-time 60 \
            -A "$GOFILE_USER_AGENT" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-Website-Token: $WT" \
            -H "X-BL: $GOFILE_LANGUAGE" \
            -H "Origin: https://gofile.io" \
            -H "Referer: https://gofile.io/" \
            -X POST \
            "https://api.gofile.io/accounts")

          echo "HTTP status: $HTTP_STATUS"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Gofile guest account creation failed."
            cat "$RESPONSE"
            exit 1
          fi

          GOFILE_TOKEN="$(jq -r '.data.token // empty' "$RESPONSE")"

          if [[ -z "$GOFILE_TOKEN" || "$GOFILE_TOKEN" == "null" ]]; then
            echo "ERROR: Gofile account token was not returned."
            cat "$RESPONSE"
            exit 1
          fi

          echo "GOFILE_TOKEN=$GOFILE_TOKEN" >> "$GITHUB_ENV"

          echo "Gofile guest account created successfully."


      # ============================================================
      # GET GOFILE CONTENT METADATA
      # ============================================================

      - name: Get Gofile content metadata
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "GET GOFILE CONTENT"
          echo "=============================================="

          RESPONSE="$WORK_DIR/content.json"

          SUCCESS=0

          CURRENT_WINDOW="$(( $(date +%s) / 14400 ))"

          for OFFSET in 0 1 2 3; do

            TIME_WINDOW="$((CURRENT_WINDOW - OFFSET))"

            echo
            echo "Trying WT time window: $TIME_WINDOW"

            INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::${GOFILE_TOKEN}::${TIME_WINDOW}::${GOFILE_WT_SECRET}"

            WT="$(printf '%s' "$INPUT" | sha256sum | awk '{print $1}')"

            HTTP_STATUS="$(curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --output "$RESPONSE" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 90 \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $GOFILE_TOKEN" \
              -H "X-Website-Token: $WT" \
              -H "X-BL: $GOFILE_LANGUAGE" \
              -H "Origin: https://gofile.io" \
              -H "Referer: https://gofile.io/" \
              -G \
              --data-urlencode "contentFilter=" \
              --data-urlencode "page=1" \
              --data-urlencode "pageSize=1000" \
              --data-urlencode "sortField=name" \
              --data-urlencode "sortDirection=1" \
              "https://api.gofile.io/contents/${GOFILE_ID}")

            echo "HTTP status: $HTTP_STATUS"

            if [[ "$HTTP_STATUS" == "200" ]] && jq -e '.status == "ok"' "$RESPONSE" >/dev/null 2>&1; then
              SUCCESS=1
              break
            fi

          done

          if [[ "$SUCCESS" != "1" ]]; then
            echo
            echo "ERROR: Gofile content request failed."

            if [[ -f "$RESPONSE" ]]; then
              head -c 5000 "$RESPONSE" || true
              echo
            fi

            exit 1
          fi

          echo
          echo "Gofile metadata retrieved successfully."


      # ============================================================
      # EXTRACT ACTUAL FILE
      # ============================================================

      - name: Extract Gofile file information
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$WORK_DIR/content.json"

          echo
          echo "=============================================="
          echo "EXTRACT GOFILE FILE"
          echo "=============================================="

          DATA_TYPE="$(jq -r '.data.type // empty' "$RESPONSE")"

          DOWNLOAD_URL=""
          FILE_NAME=""
          FILE_ID=""

          if [[ "$DATA_TYPE" == "file" ]]; then

            DOWNLOAD_URL="$(jq -r '.data.link // empty' "$RESPONSE")"
            FILE_NAME="$(jq -r '.data.name // empty' "$RESPONSE")"
            FILE_ID="$(jq -r '.data.id // empty' "$RESPONSE")"

          else

            CHILD_COUNT="$(jq '
              if (.data.children | type) == "object"
              then (.data.children | length)
              elif (.data.children | type) == "array"
              then (.data.children | length)
              else 0
              end
            ' "$RESPONSE")"

            echo "Children found: $CHILD_COUNT"

            if [[ "$CHILD_COUNT" != "1" ]]; then
              echo
              echo "ERROR: Expected exactly one file."
              echo "The supplied Gofile link must point to a single-file share."
              exit 1
            fi

            if jq -e '.data.children | type == "object"' "$RESPONSE" >/dev/null; then
              CHILD="$(jq -c '.data.children | to_entries[0].value' "$RESPONSE")"
            else
              CHILD="$(jq -c '.data.children[0]' "$RESPONSE")"
            fi

            DOWNLOAD_URL="$(echo "$CHILD" | jq -r '.link // empty')"
            FILE_NAME="$(echo "$CHILD" | jq -r '.name // empty')"
            FILE_ID="$(echo "$CHILD" | jq -r '.id // empty')"

          fi

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "ERROR: Could not find download URL."
            exit 1
          fi

          if [[ -z "$FILE_NAME" ]]; then
            echo "ERROR: Could not determine filename."
            exit 1
          fi

          if [[ -z "$FILE_ID" ]]; then
            echo "ERROR: Could not determine file ID."
            exit 1
          fi

          # Remove dangerous path components.
          FILE_NAME="$(basename "$FILE_NAME")"

          if [[ "$FILE_NAME" == "." || "$FILE_NAME" == ".." || -z "$FILE_NAME" ]]; then
            echo "ERROR: Invalid filename."
            exit 1
          fi

          echo "GOFILE_DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "FILE_ID=$FILE_ID" >> "$GITHUB_ENV"

          echo
          echo "File ID   : $FILE_ID"
          echo "Filename  : $FILE_NAME"
          echo "Download URL detected successfully."


      # ============================================================
      # PREPARE GOFILE COOKIE
      # ============================================================

      - name: Prepare Gofile authentication cookie
        shell: bash
        run: |
          set -euo pipefail

          COOKIE_JAR="$WORK_DIR/gofile.cookies"

          cat > "$COOKIE_JAR" <<EOF
          # Netscape HTTP Cookie File
          gofile.io	TRUE	/	FALSE	0	accountToken	$GOFILE_TOKEN
          EOF

          chmod 600 "$COOKIE_JAR"

          echo "Gofile authentication cookie prepared."


      # ============================================================
      # DOWNLOAD ACTUAL GOFILE FILE
      # ============================================================

      - name: Download file from Gofile
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$WORK_DIR/$FILE_NAME"
          COOKIE_JAR="$WORK_DIR/gofile.cookies"

          echo
          echo "=============================================="
          echo "DOWNLOAD FILE FROM GOFILE"
          echo "=============================================="

          echo "Filename: $FILE_NAME"
          echo
          echo "Starting download..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 7200 \
            --cookie "$COOKIE_JAR" \
            --cookie-jar "$COOKIE_JAR" \
            -A "$GOFILE_USER_AGENT" \
            -H "Accept: */*" \
            -H "Authorization: Bearer $GOFILE_TOKEN" \
            -H "Origin: https://gofile.io" \
            -H "Referer: $GOFILE_URL" \
            --output "$OUTPUT" \
            "$GOFILE_DOWNLOAD_URL"

          if [[ ! -f "$OUTPUT" ]]; then
            echo "ERROR: Downloaded file does not exist."
            exit 1
          fi

          FILE_SIZE="$(stat -c '%s' "$OUTPUT")"

          echo
          echo "Downloaded size: $FILE_SIZE bytes"

          if [[ "$FILE_SIZE" -lt 10240 ]]; then
            echo
            echo "ERROR: Downloaded file is suspiciously small."
            echo
            echo "File information:"
            file "$OUTPUT" || true
            echo
            echo "First bytes:"
            head -c 500 "$OUTPUT" | cat -v || true
            exit 1
          fi

          FILE_TYPE="$(file -b "$OUTPUT")"

          echo "File type: $FILE_TYPE"

          case "$FILE_TYPE" in
            *HTML*|*HTML\ document*|*XML*|*JSON*|*ASCII\ text*|*Unicode\ text*)
              echo
              echo "ERROR: Gofile returned a webpage/text response instead of the ROM."
              echo
              head -c 1000 "$OUTPUT" | cat -v || true
              exit 1
              ;;
          esac

          SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"

          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"
          echo "FILE_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo
          echo "Download completed successfully."
          echo "SHA256: $SHA256"


      # ============================================================
      # DISPLAY DOWNLOADED FILE
      # ============================================================

      - name: Verify downloaded ROM
        shell: bash
        run: |
          set -euo pipefail

          FILE="$WORK_DIR/$FILE_NAME"

          echo
          echo "=============================================="
          echo "DOWNLOADED FILE"
          echo "=============================================="

          ls -lh "$FILE"

          echo
          echo "File:"
          file "$FILE"

          echo
          echo "Size:"
          numfmt --to=iec "$FILE_SIZE"

          echo
          echo "SHA256:"
          echo "$FILE_SHA256"


      # ============================================================
      # SOURCEFORGE SSH CONFIGURATION
      # ============================================================

      - name: Configure SourceForge SSH key
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "CONFIGURE SOURCEFORGE SSH"
          echo "=============================================="

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "ERROR: SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_SSH_KEY:-}" ]]; then
            echo "ERROR: SOURCEFORGE_SSH_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SOURCEFORGE_SSH_KEY" \
            > "$HOME/.ssh/sourceforge_mistos"

          chmod 600 "$HOME/.ssh/sourceforge_mistos"

          echo
          echo "Validating private SSH key..."

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/sourceforge_mistos" \
            > "$HOME/.ssh/sourceforge_mistos.pub"

          chmod 644 "$HOME/.ssh/sourceforge_mistos.pub"

          echo "Private key is valid."

          cat > "$HOME/.ssh/config" <<EOF
          Host sourceforge-frs
              HostName ${SOURCEFORGE_HOST}
              User ${SOURCEFORGE_USER}
              IdentityFile ${HOME}/.ssh/sourceforge_mistos
              IdentitiesOnly yes
              PubkeyAuthentication yes
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              ChallengeResponseAuthentication no
              StrictHostKeyChecking no
              ServerAliveInterval 30
              ServerAliveCountMax 10
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo
          echo "SourceForge SSH configuration created."


      # ============================================================
      # TEST SOURCEFORGE AUTHENTICATION
      # ============================================================

      - name: Test SourceForge SSH authentication
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "TEST SOURCEFORGE SSH AUTHENTICATION"
          echo "=============================================="

          echo "Host: $SOURCEFORGE_HOST"
          echo "User: ${{ secrets.SOURCEFORGE_USER }}"

          if ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            sourceforge-frs \
            "echo SOURCEFORGE_AUTH_OK"
          then
            echo
            echo "SourceForge SSH authentication successful."
          else
            echo
            echo "=============================================="
            echo "SOURCEFORGE AUTHENTICATION FAILED"
            echo "=============================================="
            echo
            echo "Check:"
            echo "1. SOURCEFORGE_USER is correct."
            echo "2. SOURCEFORGE_SSH_KEY contains the private key."
            echo "3. The matching public key is added to SourceForge."
            echo "4. The SourceForge account has developer access to project-mistos."
            echo "5. The private key has no passphrase."
            echo
            exit 1
          fi


      # ============================================================
      # CREATE SOURCEFORGE DEVICE DIRECTORY
      # ============================================================

      - name: Prepare SourceForge device directory
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$SOURCEFORGE_BASE/$DEVICE"

          echo
          echo "=============================================="
          echo "SOURCEFORGE DIRECTORY"
          echo "=============================================="

          echo "Remote base:"
          echo "$SOURCEFORGE_BASE"

          echo
          echo "Device:"
          echo "$DEVICE"

          echo
          echo "Remote directory:"
          echo "$DEVICE_DIR"

          ssh \
            -o BatchMode=yes \
            sourceforge-frs \
            "mkdir -p '$DEVICE_DIR'"

          echo
          echo "Device directory is ready."


      # ============================================================
      # UPLOAD TO SOURCEFORGE
      # ============================================================

      - name: Upload ROM to SourceForge
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_FILE="$WORK_DIR/$FILE_NAME"
          REMOTE_DIR="$SOURCEFORGE_BASE/$DEVICE"
          REMOTE_FILE="$REMOTE_DIR/$FILE_NAME"

          echo
          echo "=============================================="
          echo "UPLOAD TO SOURCEFORGE"
          echo "=============================================="

          echo "Local file:"
          echo "$LOCAL_FILE"

          echo
          echo "Remote directory:"
          echo "$REMOTE_DIR"

          echo
          echo "Remote file:"
          echo "$REMOTE_FILE"

          echo
          echo "Starting rsync upload..."
          echo

          rsync \
            -avP \
            --partial \
            --inplace \
            --human-readable \
            -e "ssh -o BatchMode=yes" \
            "$LOCAL_FILE" \
            "sourceforge-frs:$REMOTE_DIR/"

          echo
          echo "SourceForge upload completed."


      # ============================================================
      # VERIFY SOURCEFORGE UPLOAD
      # ============================================================

      - name: Verify SourceForge upload
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_FILE="$SOURCEFORGE_BASE/$DEVICE/$FILE_NAME"

          echo
          echo "=============================================="
          echo "VERIFY SOURCEFORGE UPLOAD"
          echo "=============================================="

          echo "Remote file:"
          echo "$REMOTE_FILE"

          REMOTE_SIZE="$(
            ssh \
              -o BatchMode=yes \
              sourceforge-frs \
              "stat -c '%s' '$REMOTE_FILE'"
          )"

          echo
          echo "Local size : $FILE_SIZE bytes"
          echo "Remote size: $REMOTE_SIZE bytes"

          if [[ "$REMOTE_SIZE" != "$FILE_SIZE" ]]; then
            echo
            echo "ERROR: Remote file size does not match local file."
            exit 1
          fi

          REMOTE_SHA256="$(
            ssh \
              -o BatchMode=yes \
              sourceforge-frs \
              "sha256sum '$REMOTE_FILE' | awk '{print \$1}'"
          )"

          echo
          echo "Local SHA256 : $FILE_SHA256"
          echo "Remote SHA256: $REMOTE_SHA256"

          if [[ "$REMOTE_SHA256" != "$FILE_SHA256" ]]; then
            echo
            echo "ERROR: SHA256 checksum mismatch."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "UPLOAD VERIFIED SUCCESSFULLY"
          echo "=============================================="


      # ============================================================
      # PRINT FINAL SOURCEFORGE URL
      # ============================================================

      - name: Show SourceForge download URL
        shell: bash
        run: |
          set -euo pipefail

          SOURCEFORGE_URL="https://sourceforge.net/projects/project-mistos/files/Android17/$DEVICE/$FILE_NAME"

          echo
          echo "============================================================"
          echo "                    MISTOS UPLOAD COMPLETE"
          echo "============================================================"
          echo
          echo "Device:"
          echo "  $DEVICE"
          echo
          echo "File:"
          echo "  $FILE_NAME"
          echo
          echo "Size:"
          echo "  $(numfmt --to=iec "$FILE_SIZE")"
          echo
          echo "SHA256:"
          echo "  $FILE_SHA256"
          echo
          echo "SourceForge:"
          echo "  $SOURCEFORGE_URL"
          echo
          echo "============================================================"
