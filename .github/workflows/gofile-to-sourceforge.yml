name: Gofile to MistOS SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (raphael, bluejay, lisa, sweet, raven, etc.)"
        required: true
        type: string

jobs:
  transfer:
    name: Gofile → SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_PROJECT: project-mistos
      SOURCEFORGE_BASE_DIR: Android17

      GOFILE_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ==========================================================
      # 1. Prepare environment
      # ==========================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              MistOS GOFILE → SOURCEFORGE"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            file \
            openssh-client \
            sshpass \
            ca-certificates \
            python3

          mkdir -p "$RUNNER_TEMP/mistos-transfer/download"
          mkdir -p "$RUNNER_TEMP/mistos-transfer/logs"

          echo
          echo "Environment ready."

      # ==========================================================
      # 2. Validate inputs
      # ==========================================================

      - name: Validate inputs
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    INPUT VALIDATION"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "::error::Gofile URL is empty."
            exit 1
          fi

          if [[ ! "$GOFILE_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid Gofile URL."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "::error::Device name is empty."
            exit 1
          fi

          if [[ "$DEVICE" == "." || "$DEVICE" == ".." ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ "$DEVICE" == *"/"* || "$DEVICE" == *"\\"* ]]; then
            echo "::error::Device name cannot contain / or \\."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          echo "Gofile URL : $GOFILE_URL"
          echo "Device     : $DEVICE"

          echo
          echo "SourceForge destination:"
          echo "Android17/$DEVICE/"

      # ==========================================================
      # 3. Check SourceForge credentials
      # ==========================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CREDENTIAL CHECK"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "::error::SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "::error::SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "SourceForge user: $SOURCEFORGE_USER"
          echo "Password: ********"
          echo
          echo "Credentials found."

      # ==========================================================
      # 4. Extract Gofile ID
      # ==========================================================

      - name: Extract Gofile ID
        shell: bash
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  GOFILE ID EXTRACTION"
          echo "============================================================"

          CLEAN_URL="${GOFILE_URL%%\?*}"
          CLEAN_URL="${CLEAN_URL%/}"

          if [[ "$CLEAN_URL" =~ /d/([^/]+)$ ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not extract Gofile ID."
            echo
            echo "Expected:"
            echo "https://gofile.io/d/XXXXXXXX"
            exit 1
          fi

          echo "Gofile ID: $GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. Get Gofile guest account
      # ==========================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              CREATE GOFILE GUEST ACCOUNT"
          echo "============================================================"

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 5 \
              -X POST \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              "https://api.gofile.io/accounts"
          )"

          TOKEN="$(
            echo "$RESPONSE" |
              jq -r '.data.token // empty'
          )"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::Unable to create Gofile guest account."
            echo "$RESPONSE" | jq . 2>/dev/null || true
            exit 1
          fi

          echo "Gofile guest token obtained."

          echo "GOFILE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. Get CURRENT website token salt
      # ==========================================================

      - name: Get current Gofile website token salt
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "           GET CURRENT GOFILE WEBSITE TOKEN"
          echo "============================================================"

          TMP_JS="$RUNNER_TEMP/mistos-transfer/logs/gofile_wt.js"

          echo "Downloading current Gofile website token script..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            -A "$GOFILE_USER_AGENT" \
            "https://gofile.io/dist/js/wt.obf.js" \
            -o "$TMP_JS"

          echo "Website token script downloaded."

          echo
          echo "Searching for token-generation salt..."

          # Try the currently documented/reported salt patterns.
          SALT="$(
            python3 - "$TMP_JS" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          data = open(
              path,
              "r",
              encoding="utf-8",
              errors="ignore"
          ).read()

          candidates = []

          # Look for 16-character strings near SHA/token generation.
          for match in re.finditer(
              r'["\x27]([A-Za-z0-9]{12,32})["\x27]',
              data
          ):
              value = match.group(1)

              if len(value) >= 12:
                  candidates.append(value)

          # Prefer known current-looking 16 character salts.
          for value in candidates:
              if len(value) == 16:
                  print(value)
                  sys.exit(0)

          # Older implementations used this value.
          for value in candidates:
              if value == "5d4f7g8sd45fsd":
                  print(value)
                  sys.exit(0)

          sys.exit(1)
          PY
          )" || true

          if [[ -z "$SALT" ]]; then
            echo "::error::Could not automatically determine the current Gofile website-token salt."
            echo
            echo "Gofile may have changed its website token implementation."
            echo
            echo "First part of wt.obf.js:"
            head -c 2000 "$TMP_JS" || true
            echo
            exit 1
          fi

          echo "Current website token salt detected."

          # Do not print the salt itself.
          echo "GOFILE_WT_SALT=$SALT" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. Generate website token
      # ==========================================================

      - name: Generate Gofile website token
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             GENERATE GOFILE WEBSITE TOKEN"
          echo "============================================================"

          python3 <<'PY'
          import hashlib
          import os
          import time

          ua = os.environ["GOFILE_USER_AGENT"]
          language = os.environ["GOFILE_LANGUAGE"]
          token = os.environ["GOFILE_TOKEN"]
          salt = os.environ["GOFILE_WT_SALT"]

          time_window = int(time.time()) // 14400

          raw = (
              f"{ua}::"
              f"{language}::"
              f"{token}::"
              f"{time_window}::"
              f"{salt}"
          )

          website_token = hashlib.sha256(
              raw.encode()
          ).hexdigest()

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"GOFILE_WEBSITE_TOKEN={website_token}\n"
              )

          print("Website token generated.")
          print(f"Time window: {time_window}")
          PY

      # ==========================================================
      # 8. Get Gofile content with rate-limit handling
      # ==========================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                 GET GOFILE CONTENT"
          echo "============================================================"

          API_URL="https://api.gofile.io/contents/${GOFILE_ID}"

          RESPONSE_FILE="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          MAX_ATTEMPTS=8

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do

            echo
            echo "Attempt $attempt/$MAX_ATTEMPTS"
            echo "Requesting:"
            echo "$API_URL"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --connect-timeout 30 \
                --max-time 120 \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                -H "X-Website-Token: ${GOFILE_WEBSITE_TOKEN}" \
                -H "X-BL: ${GOFILE_LANGUAGE}" \
                "$API_URL" \
                || true
            )"

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]]; then

              STATUS="$(
                jq -r '.status // empty' "$RESPONSE_FILE" 2>/dev/null || true
              )"

              if [[ "$STATUS" == "ok" ]]; then
                echo
                echo "Gofile content request successful."
                break
              fi

              echo
              echo "Gofile returned:"
              jq . "$RESPONSE_FILE" 2>/dev/null || cat "$RESPONSE_FILE"

            elif [[ "$HTTP_CODE" == "401" ]]; then

              echo
              echo "Gofile returned HTTP 401."
              echo "Refreshing website token..."

              # Regenerate in case the 4-hour window changed.
              python3 <<'PY'
          import hashlib
          import os
          import time

          raw = (
              f"{os.environ['GOFILE_USER_AGENT']}::"
              f"{os.environ['GOFILE_LANGUAGE']}::"
              f"{os.environ['GOFILE_TOKEN']}::"
              f"{int(time.time()) // 14400}::"
              f"{os.environ['GOFILE_WT_SALT']}"
          )

          wt = hashlib.sha256(raw.encode()).hexdigest()

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"GOFILE_WEBSITE_TOKEN={wt}\n")
          PY

            elif [[ "$HTTP_CODE" == "429" ]]; then

              echo
              echo "Gofile rate limit reached."

            else

              echo
              echo "Unexpected HTTP status: $HTTP_CODE"
              echo "Response:"
              cat "$RESPONSE_FILE" 2>/dev/null || true

            fi

            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo
              echo "::error::Unable to retrieve Gofile content after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            # Exponential backoff.
            WAIT=$((attempt * 15))

            echo
            echo "Waiting ${WAIT} seconds before retry..."
            sleep "$WAIT"

          done

          echo
          echo "============================================================"
          echo "                 GOFILE CONTENT READY"
          echo "============================================================"

      # ==========================================================
      # 9. Find actual file
      # ==========================================================

      - name: Find downloadable file
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "              FIND DOWNLOADABLE FILE"
          echo "============================================================"

          JSON="$RUNNER_TEMP/mistos-transfer/logs/gofile_content.json"

          FILE_INFO="$(
            jq -r '
              if (.data.type? == "file") then
                [
                  (.data.id // ""),
                  (.data.name // ""),
                  (.data.size // 0),
                  (.data.mimetype // ""),
                  (.data.link // .data.directLink // "")
                ] | @tsv

              elif (.data.children? != null) then
                [
                  .data.children[]? |
                  select(.type? == "file") |
                  [
                    (.id // ""),
                    (.name // ""),
                    (.size // 0),
                    (.mimetype // ""),
                    (.link // .directLink // "")
                  ] | @tsv
                ] | .[]

              else
                empty
              end
            ' "$JSON" |
            head -n 1
          )"

          if [[ -z "$FILE_INFO" ]]; then
            echo "::error::No downloadable file found."

            echo
            echo "Gofile response:"
            jq . "$JSON"

            exit 1
          fi

          IFS=$'\t' read -r \
            GOFILE_FILE_ID \
            GOFILE_FILENAME \
            GOFILE_EXPECTED_SIZE \
            GOFILE_MIMETYPE \
            GOFILE_DIRECT_LINK <<< "$FILE_INFO"

          echo "File ID       : $GOFILE_FILE_ID"
          echo "Filename      : $GOFILE_FILENAME"
          echo "Expected size : $GOFILE_EXPECTED_SIZE"
          echo "MIME type     : $GOFILE_MIMETYPE"

          if [[ -z "$GOFILE_DIRECT_LINK" ]]; then
            echo "::error::No direct download link was returned."
            exit 1
          fi

          echo
          echo "Download link obtained."

          {
            echo "GOFILE_FILE_ID=$GOFILE_FILE_ID"
            echo "GOFILE_FILENAME=$GOFILE_FILENAME"
            echo "GOFILE_EXPECTED_SIZE=$GOFILE_EXPECTED_SIZE"
            echo "GOFILE_MIMETYPE=$GOFILE_MIMETYPE"
            echo "GOFILE_DIRECT_LINK=$GOFILE_DIRECT_LINK"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # 10. Download actual file
      # ==========================================================

      - name: Download Gofile file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                    GOFILE DOWNLOAD"
          echo "============================================================"

          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"

          OUTPUT_FILE="$DOWNLOAD_DIR/$GOFILE_FILENAME"

          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_EXPECTED_SIZE bytes"

          echo
          echo "Starting download..."
          echo

          wget \
            --continue \
            --show-progress \
            --progress=dot:giga \
            --timeout=60 \
            --tries=10 \
            --waitretry=10 \
            --retry-connrefused \
            --user-agent="$GOFILE_USER_AGENT" \
            -O "$OUTPUT_FILE" \
            "$GOFILE_DIRECT_LINK"

          echo
          echo "Download completed."

          if [[ ! -s "$OUTPUT_FILE" ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          ls -lh "$OUTPUT_FILE"

      # ==========================================================
      # 11. Validate download
      # ==========================================================

      - name: Validate downloaded file
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  DOWNLOAD VALIDATION"
          echo "============================================================"

          FILE="$DOWNLOAD_DIR/$GOFILE_FILENAME"

          SIZE="$(stat -c '%s' "$FILE")"
          HUMAN_SIZE="$(du -h "$FILE" | cut -f1)"
          FILE_TYPE="$(file -b "$FILE")"
          SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "Filename : $GOFILE_FILENAME"
          echo "Size     : $SIZE bytes"
          echo "Size     : $HUMAN_SIZE"
          echo "Type     : $FILE_TYPE"
          echo "SHA256   : $SHA256"

          echo

          if [[ "$SIZE" -lt 10000 ]]; then
            echo "::error::Downloaded file is suspiciously small."
            echo
            echo "First 500 bytes:"
            head -c 500 "$FILE" || true
            exit 1
          fi

          if echo "$FILE_TYPE" |
            grep -qiE \
              'HTML document|XML document|ASCII text|Unicode text|JSON'; then

            echo "::error::Downloaded response is text/HTML/JSON."
            echo
            echo "First 500 bytes:"
            head -c 500 "$FILE" || true
            exit 1
          fi

          if [[ "${GOFILE_EXPECTED_SIZE:-0}" =~ ^[0-9]+$ ]] &&
             [[ "$GOFILE_EXPECTED_SIZE" -gt 0 ]]; then

            if [[ "$SIZE" -ne "$GOFILE_EXPECTED_SIZE" ]]; then

              echo "::error::Downloaded file size mismatch."

              echo "Expected: $GOFILE_EXPECTED_SIZE"
              echo "Actual  : $SIZE"

              exit 1
            fi

            echo "Size verification: PASSED"
          fi

          {
            echo "DOWNLOADED_FILE=$FILE"
            echo "DOWNLOADED_FILENAME=$GOFILE_FILENAME"
            echo "DOWNLOADED_SIZE=$SIZE"
            echo "DOWNLOADED_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

          echo
          echo "Download verified successfully."

      # ==========================================================
      # 12. Test SourceForge
      # ==========================================================

      - name: Test SourceForge connection
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             SOURCEFORGE CONNECTION TEST"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_test.txt"

          cat > "$SCRIPT" <<EOF
          pwd
          ls
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge connection successful."

      # ==========================================================
      # 13. Check Android17
      # ==========================================================

      - name: Check Android17 directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             CHECK ANDROID17 DIRECTORY"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_android17.txt"

          cat > "$SCRIPT" <<EOF
          cd /home/frs/project-mistos
          ls Android17
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Android17 directory accessible."

      # ==========================================================
      # 14. Check/create device folder
      # ==========================================================

      - name: Check or create device folder
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "             CHECK DEVICE DIRECTORY"
          echo "============================================================"

          BASE_DIR="/home/frs/project-mistos/Android17"
          DEVICE_DIR="${BASE_DIR}/${DEVICE}"

          CHECK_SCRIPT="$RUNNER_TEMP/sourceforge_check_device.txt"

          cat > "$CHECK_SCRIPT" <<EOF
          cd ${BASE_DIR}
          ls ${DEVICE}
          bye
          EOF

          chmod 600 "$CHECK_SCRIPT"

          set +e

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -b "$CHECK_SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net" \
            > "$RUNNER_TEMP/mistos-transfer/logs/device_check.log" 2>&1

          STATUS=$?

          set -e

          if [[ "$STATUS" -eq 0 ]]; then

            echo
            echo "Device folder already exists:"
            echo "$DEVICE_DIR"

          else

            echo
            echo "Device folder does not exist."
            echo "Creating:"
            echo "$DEVICE_DIR"

            CREATE_SCRIPT="$RUNNER_TEMP/sourceforge_create_device.txt"

            cat > "$CREATE_SCRIPT" <<EOF
          cd ${BASE_DIR}
          mkdir ${DEVICE}
          bye
          EOF

            chmod 600 "$CREATE_SCRIPT"

            SSHPASS="$SOURCEFORGE_PASSWORD" \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oConnectTimeout=60 \
              -b "$CREATE_SCRIPT" \
              "${SOURCEFORGE_USER}@frs.sourceforge.net"

            echo
            echo "Device folder created."
          fi

          echo "SOURCEFORGE_DEVICE_DIR=$DEVICE_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 15. Upload
      # ==========================================================

      - name: Upload to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                  SOURCEFORGE UPLOAD"
          echo "============================================================"

          echo "File:"
          echo "$DOWNLOADED_FILENAME"

          echo
          echo "Size:"
          echo "$DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "$DOWNLOADED_SHA256"

          echo
          echo "Destination:"
          echo "$SOURCEFORGE_DEVICE_DIR"

          SCRIPT="$RUNNER_TEMP/sourceforge_upload.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          put "${DOWNLOADED_FILE}" "${DOWNLOADED_FILENAME}"
          ls -l "${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          echo
          echo "Starting upload..."
          echo

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "SourceForge upload completed."

      # ==========================================================
      # 16. Verify upload
      # ==========================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          SCRIPT="$RUNNER_TEMP/sourceforge_verify.txt"

          cat > "$SCRIPT" <<EOF
          cd ${SOURCEFORGE_DEVICE_DIR}
          ls -l "${DOWNLOADED_FILENAME}"
          bye
          EOF

          chmod 600 "$SCRIPT"

          SSHPASS="$SOURCEFORGE_PASSWORD" \
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=60 \
            -oServerAliveInterval=30 \
            -oServerAliveCountMax=10 \
            -b "$SCRIPT" \
            "${SOURCEFORGE_USER}@frs.sourceforge.net"

          echo
          echo "Upload verified."

      # ==========================================================
      # 17. Cleanup ALWAYS
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mistos-transfer/download
        run: |
          set +e

          echo "============================================================"
          echo "                       CLEANUP"
          echo "============================================================"

          rm -rf "$DOWNLOAD_DIR"

          rm -f \
            "$RUNNER_TEMP/sourceforge_test.txt" \
            "$RUNNER_TEMP/sourceforge_android17.txt" \
            "$RUNNER_TEMP/sourceforge_check_device.txt" \
            "$RUNNER_TEMP/sourceforge_create_device.txt" \
            "$RUNNER_TEMP/sourceforge_upload.txt" \
            "$RUNNER_TEMP/sourceforge_verify.txt"

          echo
          echo "Local downloaded files removed."

          if [[ -d "$DOWNLOAD_DIR" ]]; then
            echo "::warning::Download directory still exists."
          else
            echo "Cleanup successful."
          fi

      # ==========================================================
      # 18. Summary
      # ==========================================================

      - name: Final summary
        if: always()
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          echo
          echo "============================================================"
          echo "                    TRANSFER SUMMARY"
          echo "============================================================"

          echo "Device : $DEVICE"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo "File   : $DOWNLOADED_FILENAME"
          fi

          if [[ -n "${DOWNLOADED_SIZE:-}" ]]; then
            echo "Size   : $DOWNLOADED_SIZE bytes"
          fi

          if [[ -n "${DOWNLOADED_SHA256:-}" ]]; then
            echo "SHA256 : $DOWNLOADED_SHA256"
          fi

          echo
          echo "SourceForge directory:"
          echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/"

          if [[ -n "${DOWNLOADED_FILENAME:-}" ]]; then
            echo
            echo "SourceForge file:"
            echo "https://sourceforge.net/projects/project-mistos/files/Android17/${DEVICE}/${DOWNLOADED_FILENAME}"
          fi

          echo
          echo "============================================================"
