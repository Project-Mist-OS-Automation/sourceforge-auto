name: Gofile → SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile download URL"
        required: true
        type: string

      device:
        description: "Device name (example: raphael, bluejay, lisa, sweet, raven)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Download Gofile → Upload SourceForge
    runs-on: ubuntu-latest

    env:
      SOURCEFORGE_HOST: frs.sourceforge.net
      SOURCEFORGE_BASE: /home/frs/project-mistos/Android17
      GOFILE_USER_AGENT: "MistOS-Gofile-Downloader/1.0"
      GOFILE_LANGUAGE: "en-US"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING DEPENDENCIES"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            sshpass \
            file

          echo
          echo "Installed versions:"
          curl --version | head -n 1
          jq --version
          node --version
          file --version | head -n 1


      # ============================================================
      # PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/mistos"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          echo "WORK=$WORK" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "PREPARING WORKSPACE"
          echo "============================================================"

          echo "Workspace:"
          echo "$WORK"


      # ============================================================
      # VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          GOFILE_URL="${{ inputs.gofile_url }}"
          DEVICE="${{ inputs.device }}"

          echo "============================================================"
          echo "VALIDATING INPUTS"
          echo "============================================================"

          if [[ -z "$GOFILE_URL" ]]; then
            echo "ERROR: Gofile URL is empty."
            exit 1
          fi

          if [[ -z "$DEVICE" ]]; then
            echo "ERROR: Device name is empty."
            exit 1
          fi

          if [[ ! "$DEVICE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: Invalid device name:"
            echo "$DEVICE"
            echo
            echo "Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1
          fi

          echo
          echo "Gofile URL:"
          echo "$GOFILE_URL"

          echo
          echo "Device:"
          echo "$DEVICE"

          echo "GOFILE_URL=$GOFILE_URL" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"


      # ============================================================
      # EXTRACT GOFILE ID
      # ============================================================

      - name: Extract Gofile ID
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE ID"
          echo "============================================================"

          GOFILE_ID=""

          if [[ "$GOFILE_URL" =~ /d/([^/?#]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"

          elif [[ "$GOFILE_URL" =~ /contents/([^/?#]+) ]]; then
            GOFILE_ID="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$GOFILE_ID" ]]; then
            echo
            echo "ERROR: Could not extract Gofile content ID."
            echo
            echo "URL:"
            echo "$GOFILE_URL"
            exit 1
          fi

          echo "Gofile ID:"
          echo "$GOFILE_ID"

          echo "GOFILE_ID=$GOFILE_ID" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD GOFILE WEBSITE TOKEN SCRIPT
      # ============================================================

      - name: Get Gofile website-token script
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GET GOFILE WEBSITE TOKEN SCRIPT"
          echo "============================================================"

          WT_SCRIPT="$WORK/gofile_wt.js"

          URLS=(
            "https://gofile.io/js/wt.obf.js"
            "https://gofile.io/dist/js/wt.obf.js"
          )

          FOUND=0

          for URL in "${URLS[@]}"; do

            echo
            echo "Trying:"
            echo "$URL"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "$WT_SCRIPT" \
                --write-out "%{http_code}" \
                --connect-timeout 20 \
                --max-time 60 \
                -A "$GOFILE_USER_AGENT" \
                "$URL" \
                || true
            )"

            echo "HTTP: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]] &&
               [[ -s "$WT_SCRIPT" ]]; then

              SIZE="$(wc -c < "$WT_SCRIPT")"

              if (( SIZE > 1000 )); then

                echo
                echo "WT script downloaded."
                echo "WT script size: $SIZE bytes"

                FOUND=1
                break
              fi
            fi
          done

          if [[ "$FOUND" != "1" ]]; then

            echo
            echo "ERROR: Could not download Gofile WT script."

            exit 1
          fi


      # ============================================================
      # EXTRACT GOFILE WT SECRET
      # ============================================================

      - name: Extract Gofile WT secret
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE WEBSITE TOKEN SECRET"
          echo "============================================================"

          cat > "$WORK/extract_wt_secret.js" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const crypto = require("crypto");

          const scriptFile = process.argv[2];

          if (!scriptFile) {
            throw new Error("Missing script file");
          }

          const script = fs.readFileSync(scriptFile, "utf8");

          let rawHashInput = "";

          const probeUserAgent = "MistOSGofileUserAgent";
          const probeLanguage = "MistOSGofileLanguage";
          const probeToken = "MistOSGofileToken";

          const navigator = {
            userAgent: probeUserAgent,
            language: probeLanguage
          };

          const context = vm.createContext(
            {
              appdata: {},

              crypto: crypto.webcrypto,

              console: {
                error() {},
                log() {},
                warn() {}
              },

              Date,
              Math,
              navigator,
              URLSearchParams,

              window: {
                crypto: crypto.webcrypto,

                location: {
                  hostname: "gofile.io",
                  search: ""
                },

                navigator
              }
            },
            {
              name: "gofile-website-token"
            }
          );

          vm.runInContext(
            script,
            context,
            {
              timeout: 3000
            }
          );

          if (typeof context.generateWT !== "function") {
            throw new Error(
              "generateWT() was not found in wt.obf.js"
            );
          }

          context._sha256 = (input) => {
            rawHashInput = String(input);

            return "0".repeat(64);
          };

          vm.runInContext(
            `generateWT(${JSON.stringify(probeToken)})`,
            context,
            {
              timeout: 3000
            }
          );

          if (!rawHashInput) {
            throw new Error(
              "generateWT() did not call the intercepted SHA-256 function"
            );
          }

          const expectedPrefix =
            `${probeUserAgent}::${probeLanguage}::${probeToken}::`;

          if (!rawHashInput.startsWith(expectedPrefix)) {
            throw new Error(
              "Unexpected Gofile WT hash input format: " +
              rawHashInput
            );
          }

          const remainder =
            rawHashInput.slice(expectedPrefix.length);

          const parts = remainder.split("::");

          if (parts.length < 2) {
            throw new Error(
              "Could not extract Gofile WT secret"
            );
          }

          const secret = parts.slice(1).join("::").trim();

          if (!secret) {
            throw new Error(
              "Extracted Gofile WT secret is empty"
            );
          }

          process.stdout.write(secret);
          NODE

          SECRET="$(
            node \
              "$WORK/extract_wt_secret.js" \
              "$WORK/gofile_wt.js"
          )"

          if [[ -z "$SECRET" ]]; then
            echo "ERROR: No Gofile WT secret found."
            exit 1
          fi

          echo
          echo "Gofile WT secret extracted successfully."

          {
            echo "GOFILE_WT_SECRET<<EOF"
            echo "$SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"


      # ============================================================
      # CREATE GOFILE GUEST ACCOUNT
      # ============================================================

      - name: Create Gofile guest account
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CREATE GOFILE GUEST ACCOUNT"
          echo "============================================================"

          ACCOUNT_RESPONSE="$WORK/account.json"

          CURRENT_WINDOW="$(date +%s)"
          CURRENT_WINDOW=$(( CURRENT_WINDOW / 14400 ))

          echo "Current WT time window:"
          echo "$CURRENT_WINDOW"

          WT_INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::::${CURRENT_WINDOW}::${GOFILE_WT_SECRET}"

          WT="$(
            printf '%s' "$WT_INPUT" |
            sha256sum |
            awk '{print $1}'
          )"

          echo
          echo "Creating guest account..."

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --compressed \
              --output "$ACCOUNT_RESPONSE" \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 90 \
              -A "$GOFILE_USER_AGENT" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer " \
              -H "X-Website-Token: ${WT}" \
              -H "X-BL: ${GOFILE_LANGUAGE}" \
              -H "Origin: https://gofile.io" \
              -H "Referer: https://gofile.io/" \
              -X POST \
              "https://api.gofile.io/accounts" \
              || true
          )"

          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then

            echo
            echo "ERROR: Gofile guest account creation failed."

            jq . "$ACCOUNT_RESPONSE" 2>/dev/null ||
              cat "$ACCOUNT_RESPONSE"

            exit 1
          fi

          API_STATUS="$(
            jq -r '.status // empty' "$ACCOUNT_RESPONSE" 2>/dev/null ||
            true
          )"

          echo "API status: $API_STATUS"

          if [[ "$API_STATUS" != "ok" ]]; then

            echo
            echo "ERROR: Gofile account API did not return status=ok."

            jq . "$ACCOUNT_RESPONSE" 2>/dev/null ||
              cat "$ACCOUNT_RESPONSE"

            exit 1
          fi

          GOFILE_TOKEN="$(
            jq -r '.data.token // empty' "$ACCOUNT_RESPONSE"
          )"

          if [[ -z "$GOFILE_TOKEN" ]]; then
            echo
            echo "ERROR: Gofile account token is missing."
            exit 1
          fi

          echo
          echo "Gofile guest account created successfully."

          echo "GOFILE_TOKEN=$GOFILE_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # GET GOFILE CONTENT
      # ============================================================

      - name: Get Gofile content
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GET GOFILE CONTENT"
          echo "============================================================"

          RESPONSE="$WORK/gofile_content.json"

          SUCCESS=0

          CURRENT_WINDOW="$(date +%s)"
          CURRENT_WINDOW=$(( CURRENT_WINDOW / 14400 ))

          # Try current and previous WT time windows.

          for OFFSET in 0 1 2; do

            WINDOW=$(( CURRENT_WINDOW - OFFSET ))

            echo
            echo "Trying WT time window: $WINDOW"

            WT_INPUT="${GOFILE_USER_AGENT}::${GOFILE_LANGUAGE}::${GOFILE_TOKEN}::${WINDOW}::${GOFILE_WT_SECRET}"

            WT="$(
              printf '%s' "$WT_INPUT" |
              sha256sum |
              awk '{print $1}'
            )"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --compressed \
                --output "$RESPONSE" \
                --write-out "%{http_code}" \
                --connect-timeout 30 \
                --max-time 90 \
                -A "$GOFILE_USER_AGENT" \
                -H "Accept: application/json" \
                -H "Authorization: Bearer ${GOFILE_TOKEN}" \
                -H "X-Website-Token: ${WT}" \
                -H "X-BL: ${GOFILE_LANGUAGE}" \
                -H "Origin: https://gofile.io" \
                -H "Referer: https://gofile.io/" \
                -G \
                --data-urlencode "contentFilter=" \
                --data-urlencode "page=1" \
                --data-urlencode "pageSize=1000" \
                --data-urlencode "sortField=name" \
                --data-urlencode "sortDirection=1" \
                "https://api.gofile.io/contents/${GOFILE_ID}" \
                || true
            )"

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" == "200" ]]; then

              STATUS="$(
                jq -r '.status // empty' "$RESPONSE" 2>/dev/null ||
                true
              )"

              echo "API status: $STATUS"

              if [[ "$STATUS" == "ok" ]]; then

                SUCCESS=1

                echo
                echo "GOFILE CONTENT FOUND"
                echo

                jq . "$RESPONSE"

                break
              fi

              echo
              echo "Gofile returned HTTP 200 but API status was not ok."

              jq . "$RESPONSE" 2>/dev/null ||
                cat "$RESPONSE"

            elif [[ "$HTTP_CODE" == "429" ]]; then

              echo
              echo "Gofile rate limit reached."
              echo "Waiting before retry..."

              sleep 10

            else

              echo
              echo "Gofile response:"

              jq . "$RESPONSE" 2>/dev/null ||
                cat "$RESPONSE"

            fi

            sleep 2

          done

          if [[ "$SUCCESS" != "1" ]]; then

            echo
            echo "============================================================"
            echo "GOFILE CONTENT REQUEST FAILED"
            echo "============================================================"

            echo
            echo "Raw response:"

            cat "$RESPONSE" 2>/dev/null || true

            exit 1
          fi


      # ============================================================
      # EXTRACT ACTUAL FILE
      # ============================================================

      - name: Extract Gofile file information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "EXTRACT GOFILE FILE INFORMATION"
          echo "============================================================"

          RESPONSE="$WORK/gofile_content.json"

          TYPE="$(
            jq -r '.data.type // empty' "$RESPONSE"
          )"

          echo "Content type: ${TYPE:-unknown}"

          if [[ "$TYPE" == "file" ]]; then

            FILE_JSON="$(
              jq -c '.data' "$RESPONSE"
            )"

          else

            CHILDREN_TYPE="$(
              jq -r '.data.children | type // empty' "$RESPONSE"
            )"

            if [[ "$CHILDREN_TYPE" == "object" ]]; then

              FILE_JSON="$(
                jq -c '
                  [
                    .data.children[]
                    | select(.type == "file")
                  ]
                  | if length == 1
                    then .[0]
                    else
                      error(
                        "Expected exactly one file, found \(length)"
                      )
                    end
                ' "$RESPONSE"
              )"

            elif [[ "$CHILDREN_TYPE" == "array" ]]; then

              FILE_JSON="$(
                jq -c '
                  [
                    .data.children[]
                    | select(.type == "file")
                  ]
                  | if length == 1
                    then .[0]
                    else
                      error(
                        "Expected exactly one file, found \(length)"
                      )
                    end
                ' "$RESPONSE"
              )"

            else

              echo
              echo "ERROR: No usable Gofile file found."
              exit 1

            fi
          fi

          GOFILE_FILENAME="$(
            jq -r '.name // empty' <<< "$FILE_JSON"
          )"

          GOFILE_LINK="$(
            jq -r '.link // empty' <<< "$FILE_JSON"
          )"

          GOFILE_SIZE="$(
            jq -r '.size // 0' <<< "$FILE_JSON"
          )"

          if [[ -z "$GOFILE_FILENAME" ]]; then
            echo "ERROR: Gofile filename is missing."
            exit 1
          fi

          if [[ -z "$GOFILE_LINK" ]]; then
            echo "ERROR: Gofile download link is missing."
            exit 1
          fi

          if [[ "$GOFILE_SIZE" == "null" ]]; then
            GOFILE_SIZE=0
          fi

          GOFILE_FILENAME="$(basename -- "$GOFILE_FILENAME")"

          if [[ "$GOFILE_FILENAME" == "." ||
                "$GOFILE_FILENAME" == ".." ||
                "$GOFILE_FILENAME" == */* ]]; then

            echo "ERROR: Unsafe filename:"
            echo "$GOFILE_FILENAME"

            exit 1
          fi

          echo
          echo "Filename:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Expected size:"
          echo "$GOFILE_SIZE bytes"

          echo
          echo "Download URL:"
          echo "$GOFILE_LINK"

          echo "GOFILE_FILENAME=$GOFILE_FILENAME" >> "$GITHUB_ENV"
          echo "GOFILE_LINK=$GOFILE_LINK" >> "$GITHUB_ENV"
          echo "GOFILE_SIZE=$GOFILE_SIZE" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD ACTUAL FILE
      # ============================================================

      - name: Download file from Gofile
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DOWNLOAD FILE FROM GOFILE"
          echo "============================================================"

          DOWNLOAD="$WORK/$GOFILE_FILENAME"

          echo
          echo "Downloading:"
          echo "$GOFILE_FILENAME"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 3600 \
            -A "$GOFILE_USER_AGENT" \
            --output "$DOWNLOAD" \
            "$GOFILE_LINK"

          if [[ ! -f "$DOWNLOAD" ]]; then
            echo "ERROR: Downloaded file does not exist."
            exit 1
          fi

          ACTUAL_SIZE="$(
            stat -c '%s' "$DOWNLOAD"
          )"

          echo
          echo "Downloaded size:"
          echo "$ACTUAL_SIZE bytes"

          if (( ACTUAL_SIZE < 10240 )); then

            echo
            echo "ERROR: Downloaded file is suspiciously small."

            echo
            echo "File type:"
            file "$DOWNLOAD"

            echo
            echo "First bytes:"

            head -c 512 "$DOWNLOAD" |
              strings ||
              true

            exit 1
          fi

          FILE_TYPE="$(
            file -b "$DOWNLOAD"
          )"

          echo
          echo "File type:"
          echo "$FILE_TYPE"

          if echo "$FILE_TYPE" |
             grep -Eiq 'HTML|XML|JSON|ASCII text|Unicode text'; then

            echo
            echo "ERROR: Download appears to be an error page."
            exit 1
          fi

          echo
          echo "Calculating SHA256..."

          SHA256="$(
            sha256sum "$DOWNLOAD" |
            awk '{print $1}'
          )"

          echo
          echo "SHA256:"
          echo "$SHA256"

          echo "DOWNLOADED_FILE=$DOWNLOAD" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SIZE=$ACTUAL_SIZE" >> "$GITHUB_ENV"
          echo "DOWNLOADED_SHA256=$SHA256" >> "$GITHUB_ENV"


      # ============================================================
      # CHECK SOURCEFORGE CREDENTIALS
      # ============================================================

      - name: Check SourceForge credentials
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHECK SOURCEFORGE CREDENTIALS"
          echo "============================================================"

          if [[ -z "${SOURCEFORGE_USER:-}" ]]; then
            echo "ERROR: SOURCEFORGE_USER secret is missing."
            exit 1
          fi

          if [[ -z "${SOURCEFORGE_PASSWORD:-}" ]]; then
            echo "ERROR: SOURCEFORGE_PASSWORD secret is missing."
            exit 1
          fi

          echo "SourceForge username:"
          echo "$SOURCEFORGE_USER"

          echo
          echo "SourceForge password:"
          echo "configured"


      # ============================================================
      # TEST SOURCEFORGE CONNECTION
      # ============================================================

      - name: Test SourceForge SFTP
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "TEST SOURCEFORGE SFTP"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oConnectTimeout=30 \
            "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" <<EOF
          pwd
          ls
          EOF

          echo
          echo "SourceForge SFTP connection successful."


      # ============================================================
      # CHECK / CREATE DEVICE DIRECTORY
      # ============================================================

      - name: Check or create SourceForge device directory
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SOURCEFORGE DEVICE DIRECTORY"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          DEVICE_DIR="$SOURCEFORGE_BASE/$DEVICE"

          echo
          echo "Base directory:"
          echo "$SOURCEFORGE_BASE"

          echo
          echo "Device directory:"
          echo "$DEVICE_DIR"

          CHECK_SCRIPT="$WORK/check_device.sftp"

          cat > "$CHECK_SCRIPT" <<EOF
          cd $SOURCEFORGE_BASE
          ls $DEVICE
          bye
          EOF

          if sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oUserKnownHostsFile=/dev/null \
              -oConnectTimeout=30 \
              -b "$CHECK_SCRIPT" \
              "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
              > "$WORK/device_check.log" 2>&1; then

            echo
            echo "Device directory already exists."

            cat "$WORK/device_check.log"

          else

            echo
            echo "Device directory does not exist."
            echo "Creating:"
            echo "$DEVICE_DIR"

            CREATE_SCRIPT="$WORK/create_device.sftp"

            cat > "$CREATE_SCRIPT" <<EOF
          cd $SOURCEFORGE_BASE
          mkdir $DEVICE
          ls $DEVICE
          bye
          EOF

            if ! sftp \
                -oBatchMode=no \
                -oStrictHostKeyChecking=no \
                -oUserKnownHostsFile=/dev/null \
                -oConnectTimeout=30 \
                -b "$CREATE_SCRIPT" \
                "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
                > "$WORK/device_create.log" 2>&1; then

              cat "$WORK/device_create.log"

              echo
              echo "ERROR: Could not create SourceForge device directory."

              exit 1
            fi

            cat "$WORK/device_create.log"

            echo
            echo "Device directory created successfully."

          fi


      # ============================================================
      # UPLOAD TO SOURCEFORGE
      # ============================================================

      - name: Upload file to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "UPLOAD TO SOURCEFORGE"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          UPLOAD_SCRIPT="$WORK/upload.sftp"

          cat > "$UPLOAD_SCRIPT" <<EOF
          cd $SOURCEFORGE_BASE/$DEVICE
          put $DOWNLOADED_FILE $GOFILE_FILENAME
          ls -l $GOFILE_FILENAME
          bye
          EOF

          echo
          echo "Uploading:"
          echo "$GOFILE_FILENAME"

          echo
          echo "Destination:"
          echo "$SOURCEFORGE_BASE/$DEVICE/"

          sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=no \
            -oUserKnownHostsFile=/dev/null \
            -oConnectTimeout=30 \
            -b "$UPLOAD_SCRIPT" \
            "$SOURCEFORGE_USER@$SOURCEFORGE_HOST"

          echo
          echo "SourceForge upload completed."


      # ============================================================
      # VERIFY SOURCEFORGE UPLOAD
      # ============================================================

      - name: Verify SourceForge upload
        shell: bash
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFY SOURCEFORGE UPLOAD"
          echo "============================================================"

          export SSHPASS="$SOURCEFORGE_PASSWORD"

          VERIFY_SCRIPT="$WORK/verify.sftp"

          cat > "$VERIFY_SCRIPT" <<EOF
          cd $SOURCEFORGE_BASE/$DEVICE
          ls -l $GOFILE_FILENAME
          bye
          EOF

          VERIFY_LOG="$WORK/verify.log"

          if ! sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=no \
              -oUserKnownHostsFile=/dev/null \
              -oConnectTimeout=30 \
              -b "$VERIFY_SCRIPT" \
              "$SOURCEFORGE_USER@$SOURCEFORGE_HOST" \
              > "$VERIFY_LOG" 2>&1; then

            cat "$VERIFY_LOG"

            echo
            echo "ERROR: Could not verify SourceForge upload."

            exit 1
          fi

          cat "$VERIFY_LOG"

          if ! grep -Fq "$GOFILE_FILENAME" "$VERIFY_LOG"; then

            echo
            echo "ERROR: Uploaded file was not found."

            exit 1
          fi

          echo
          echo "UPLOAD VERIFIED SUCCESSFULLY."


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Transfer summary
        if: success()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "             MISTOS TRANSFER COMPLETE"
          echo "============================================================"

          echo
          echo "Device:"
          echo "  $DEVICE"

          echo
          echo "Filename:"
          echo "  $GOFILE_FILENAME"

          echo
          echo "Size:"
          echo "  $DOWNLOADED_SIZE bytes"

          echo
          echo "SHA256:"
          echo "  $DOWNLOADED_SHA256"

          echo
          echo "SourceForge directory:"
          echo "  https://sourceforge.net/projects/project-mistos/files/Android17/$DEVICE/"

          echo
          echo "File:"
          echo "  https://sourceforge.net/projects/project-mistos/files/Android17/$DEVICE/$GOFILE_FILENAME"

          echo
          echo "============================================================"


      # ============================================================
      # ALWAYS CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "CLEANUP"
          echo "============================================================"

          if [[ -n "${WORK:-}" ]]; then

            echo "Removing:"
            echo "$WORK"

            rm -rf "$WORK"
          fi

          unset SSHPASS
          unset GOFILE_TOKEN
          unset GOFILE_WT_SECRET

          echo
          echo "Cleanup completed."
